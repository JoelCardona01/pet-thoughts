modLoader="javafml"
loaderVersion="[${forge_major},)"
license="MIT"
issueTrackerURL="https://github.com/JoelCardona01/pet-thoughts/issues"

[[mods]]
modId="petthoughts"
version="${version}"
displayName="Pet Thoughts"
displayURL="https://github.com/JoelCardona01/pet-thoughts"
logoFile="icon.png"
authors="Joel Cardona"
# Server-side mod: players without it (vanilla or modded) can still join a server that has it.
displayTest="IGNORE_SERVER_VERSION"
description='''Tamed pets show thought bubbles that react to the world. Every pet gets a personality. Works in single player and on servers (no client mod needed).'''

[[dependencies.petthoughts]]
    modId="forge"
    mandatory=true
    versionRange="[${forge_major},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.petthoughts]]
    modId="minecraft"
    mandatory=true
    versionRange="[${minecraft_version},${minecraft_next_version})"
    ordering="NONE"
    side="BOTH"
