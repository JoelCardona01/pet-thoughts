# ----------------------------------------------------------------------
#  Pet Thoughts - Español
#
#  Todo es MiniMessage (https://docs.advntr.dev/minimessage/).
#  Variables que puedes usar en cualquier pensamiento:
#    <owner>   nombre del dueño
#    <pet>     nombre de la mascota (o su especie si no tiene etiqueta)
#    <mob>     el monstruo / mob implicado
#    <friend>  otra mascota cercana
#    <food>    la comida implicada
#
#  Cada pensamiento se elige de  thoughts.<personalidad>.<disparador>.
#  Las frases de  species.<especie>.<disparador>  se mezclan para esa especie.
#  Añade, cambia o borra las frases que quieras. Una lista vacía ([])
#  silencia esa combinación. Recarga con /petthoughts reload.
# ----------------------------------------------------------------------

messages:
  prefix: "<gray>[<white>💭</white>]</gray> "
  no-permission: "<red>No tienes permiso para hacer eso."
  players-only: "<red>Solo los jugadores pueden usar este comando."
  look-at-pet: "<red>Mira a una mascota domesticada (a 8 bloques como mucho)."
  not-your-pet: "<red>Esa mascota no es tuya."
  toggle-off: "<yellow>Bocadillos ocultos. Tus mascotas siguen pensando, pero ya no lo ves."
  toggle-on: "<green>Vuelves a ver los bocadillos."
  mute-on: "<yellow><pet> se guardará sus pensamientos."
  mute-off: "<green><pet> vuelve a compartir lo que piensa."
  set-done: "<green>Ahora la personalidad de <pet> es <white><personality></white>."
  unknown-personality: "<red>Personalidad desconocida. Opciones: <white><list>"
  unknown-trigger: "<red>Disparador desconocido. Usa el tabulador para verlos todos."
  test-done: "<gray>Forzado <white><trigger></white> en <pet>."
  test-no-line: "<red>No hay frases para <white><trigger></white> en el archivo de idioma."
  reloaded: "<green>Configuración e idioma recargados."
  # Aparece sobre la barra de objetos al domesticar una mascota. Déjalo vacío ("") para desactivarlo.
  tamed-hint: "<white><pet></white> <gray>tiene personalidad:</gray> <yellow><personality>"
  help:
    header: "<white>💭 <bold>Pet Thoughts</bold>"
    toggle: "<yellow>/<label> toggle <gray>- oculta o muestra los bocadillos para ti"
    info: "<yellow>/<label> info <gray>- personalidad y ánimo de la mascota que miras"
    mute: "<yellow>/<label> mute <gray>- silencia a la mascota que miras (o la deja hablar otra vez)"
    petting: "<gray>Mira a tu mascota y pulsa <white>F</white> (intercambiar manos) para acariciarla <red>❤"
    set: "<yellow>/<label> set <personalidad> <gray>- cambia la personalidad de la mascota que miras"
    test: "<yellow>/<label> test <disparador> <gray>- fuerza un pensamiento"
    reload: "<yellow>/<label> reload <gray>- recarga configuración e idioma"
  info:
    header: "<white>💭 <bold><pet></bold> <gray>(<species>)"
    personality: "<gray>Personalidad: <yellow><personality></yellow> - <description>"
    mood: "<gray>Ánimo: <white><mood>"
    health: "<gray>Vida: <red>❤ <white><health>/<max_health>"
    last-thought: "<gray>Último pensamiento: <white><italic><thought>"
    no-thought: "<dark_gray>nada todavía"
    muted: "<red>Silenciada. <gray>Usa /pt mute para que vuelva a hablar."

bubble:
  # Icono delante de cada tipo de pensamiento (admite colores y <bold>). Vacío = sin icono.
  prefix:
    thought: ""
    danger: "<#D32F2F><bold>!</bold>"
    love: "<#E0245E>❤"
    food: "<#A0522D>🍖"

