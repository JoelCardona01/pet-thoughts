# ======================================================================
#  PENSAMIENTOS POR PERSONALIDAD
# ======================================================================
thoughts:

  # --------------------------------------------------------------- LEAL
  loyal:
    pet_on_fire:
      - "¡Estoy bien! ¿<owner> está a salvo?"
      - "¡Quema! ¡No te preocupes por mí!"
      - "¡Arde, pero no me separo de ti!"
    pet_low_health:
      - "Aún puedo luchar por ti..."
      - "Duele, pero no pienso dejarte."
      - "No te preocupes por mí, <owner>."
      - "Solo es un rasguño. Uno grande."
    owner_low_health:
      - "¡<owner>, ponte detrás de mí!"
      - "¡Estás mal! ¡No te alejes!"
      - "Por favor, aguanta, <owner>."
      - "¡Nadie vuelve a tocar a <owner>!"
    hostile_nearby:
      - "¡Yo te protejo!"
      - "¡Atrás, <mob>!"
      - "¡<mob>! ¡Detrás de mí, <owner>!"
      - "No mientras yo esté aquí."
      - "Yo me encargo, <owner>."
    hostile_creeper:
      - "¡Un creeper! ¡<owner>, CORRE!"
      - "¡No te acerques, <owner>!"
      - "¡Yo lo distraigo! ¡Vete!"
    owner_returned:
      - "¡¡¡HAS VUELTO!!!"
      - "¡<owner>! ¡Te esperé justo aquí!"
      - "¡Sabía que volverías!"
      - "¡Te he echado MUCHÍSIMO de menos!"
    in_nether:
      - "Qué sitio más feo. No me separo de ti."
      - "Te sigo a donde sea. Incluso aquí."
      - "Cuidado, <owner>. El suelo es lava."
    in_end:
      - "No mires a los altos, <owner>."
      - "Sea donde sea esto, estoy contigo."
      - "Yo te cubro la espalda."
    in_water:
      - "¡Voy contigo, <owner>!"
      - "¡Nadando en equipo!"
      - "Cruzaría un océano por ti."
    owner_holds_food:
      - "¿Eso es para mí? Sin presión."
      - "Lo que me des me encantará."
      - "Yo compartiría lo mío contigo, que lo sepas."
      - "Siempre sabes lo que me gusta."
    owner_hungry:
      - "<owner>, tienes que comer algo."
      - "Come, por favor. Me preocupas."
      - "Tú me das de comer. ¿Y a ti quién?"
    sitting_long:
      - "Aquí sigo. Como me pediste."
      - "No me he movido. Lo prometo."
      - "Vigilando este sitio con mi vida."
    owner_sleeping:
      - "Descansa. Yo vigilo."
      - "Esta noche no pasa nadie."
      - "Buenas noches, <owner>."
    in_boat:
      - "¡Capitán <owner>, listos para zarpar!"
      - "¡Yo soy tu grumete!"
      - "Donde tú remes, yo voy."
    leashed:
      - "No hace falta. Nunca me iría."
      - "¡Tú guías, <owner>!"
      - "¡Paseo con <owner>! El mejor día."
    thunder:
      - "No tengas miedo, <owner>. Estoy aquí."
      - "Cuánto ruido. Yo te protejo."
      - "¡Quédate dentro, <owner>!"
    rain:
      - "La lluvia no nos para."
      - "Me mojo, pero contigo. Compensa."
      - "Luego me sacudo. A tu lado."
    owner_flying:
      - "¡Baja con cuidado, <owner>!"
      - "¡Ten cuidado ahí arriba!"
      - "Te espero aquí. Mirando al cielo."
    night:
      - "Está oscuro. Yo hago guardia."
      - "No te alejes esta noche, <owner>."
      - "Turno de noche. Protegiendo a <owner>."
    dawn:
      - "¡Buenos días, <owner>!"
      - "¡Hemos pasado la noche!"
      - "Día nuevo, la amistad de siempre."
    ridden:
      - "¡Agárrate fuerte, <owner>!"
      - "Te llevo a salvo."
      - "Dime adónde y corro."
      - "Es un honor llevarte."
    high_altitude:
      - "Cuidado con el borde, <owner>."
      - "Está muy alto. No te separes."
      - "Te sigo hasta la cima del mundo."
    underground:
      - "Está oscuro. Yo voy delante."
      - "En los túneles, detrás de mí."
      - "Oigo cosas. Estoy alerta."
    cold_biome:
      - "¡Qué frío! Acércate, que doy calor."
      - "Yo te caliento, <owner>."
      - "La nieve no nos para."
    hot_biome:
      - "Qué calor. ¿Llevas agua, <owner>?"
      - "Voy caminando por tu sombra."
      - "Hace calor, pero no me voy."
    friend_nearby:
      - "<friend> y yo te vigilamos."
      - "Buen equipo, <friend>."
      - "<friend> también es familia."
    idle:
      - "Quiero a <owner>."
      - "Tengo la mejor familia del mundo."
      - "¿Necesitas algo, <owner>?"
      - "Qué bien se está aquí."
      - "Donde tú vayas, voy yo."
      - "Vigilando a <owner>. Como siempre."
      - "¿<owner> está bien? Sí. Vale."
      - "Haría lo que fuera por <owner>."
      - "Hoy ha sido un buen día. Estabas tú."
    tamed:
      - "Te elijo a ti. Para siempre."
      - "Tú y yo, <owner>. Siempre."
      - "Nunca me iré de tu lado."
    fed:
      - "¡Gracias, <owner>!"
      - "Siempre cuidas de mí."
      - "Qué rico. Te quiero."
      - "Ahora tengo fuerzas para protegerte."
    petted:
      - "¡Yo también te quiero, <owner>!"
      - "El. Mejor. Día."
      - "¡No pares!"
      - "Por esto te protejo."
    pet_hurt:
      - "¡Ay! ¡Estoy bien! ¡Estoy bien!"
      - "Van a tener que esforzarse más."
      - "Solo duele un poco."
    hit_by_owner:
      - "Ha sido sin querer. Lo sé."
      - "Te perdono, <owner>."
      - "Te sigo queriendo."
    pet_killed_mob:
      - "Ya no te molestará más."
      - "<owner> a salvo. Misión cumplida."
      - "Nadie amenaza a mi humano."
    owner_killed_mob:
      - "¡Buen golpe, <owner>!"
      - "¡Ese es mi humano!"
      - "Hacemos buen equipo."
    owner_hurt:
      - "¡<owner>! ¿Estás bien?"
      - "¿Quién te ha hecho eso?"
      - "¡Ponte detrás de mí!"
    owner_died:
      - "¿<owner>? ¡¡¡<owner>!!!"
      - "No... yo tenía que protegerte."
      - "Te espero aquí hasta que vuelvas."
    owner_ate:
      - "Bien. Necesitas fuerzas."
      - "Que aproveche, <owner>."
      - "Me alegra verte comer."
    owner_fished:
      - "¡Buena pesca, <owner>!"
      - "Qué bien se te da."
      - "Pescar contigo es lo mejor."
    owner_found_treasure:
      - "¡Lo encontraste! ¡Lo sabía!"
      - "¡Brilla! Te lo mereces."
      - "¡Tanto picar ha valido la pena!"
    owner_advancement:
      - "¡Qué orgullo!"
      - "¡Lo has conseguido, <owner>!"
      - "Siempre he creído en ti."
    sat_down:
      - "Sentado. Te espero."
      - "Aquí estaré."
      - "Vuelve pronto, ¿vale?"
    stood_up:
      - "¡Hora de aventuras!"
      - "¡Cuando tú digas!"
      - "¡Vamos, <owner>!"
    teleported:
      - "¡Te encontré!"
      - "No me pierdes tan fácil."
      - "¡Ya estoy! ¡Ya estoy!"
    had_baby:
      - "¡Mira, <owner>! ¡Una cría!"
      - "Le enseñaré a protegerte."
      - "La familia crece."
    music:
      - "¡Nuestra canción, <owner>!"
      - "Me gusta verte feliz."
      - "¡Bailando contigo!"
    explosion:
      - "¡<owner>! ¿Estás bien?"
      - "¡Aléjate de ahí!"
      - "¡Yo me pongo entre tú y el bum!"

