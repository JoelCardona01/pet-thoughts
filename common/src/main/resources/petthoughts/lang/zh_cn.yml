# ======================================================================
#  按性格分类的想法
# ======================================================================
thoughts:

  # -------------------------------------------------------------- LOYAL
  loyal:
    pet_on_fire:
      - "我没事！<owner> 安全吗？！"
      - "好烫！好烫！别担心我！"
      - "好疼，但我会留在你身边！"
    pet_low_health:
      - "我还能为你战斗……"
      - "很疼，但我不会离开你。"
      - "别担心我，<owner>。"
      - "只是擦伤。很大的擦伤。"
    owner_low_health:
      - "<owner>，躲到我身后！"
      - "你受伤了！靠近我！"
      - "求你没事，<owner>。"
      - "谁也别想再碰 <owner>！"
    hostile_nearby:
      - "我会保护你！"
      - "退后，<mob>！"
      - "<mob>！<owner>，躲到我后面！"
      - "有我在，休想。"
      - "交给我吧，<owner>。"
    hostile_creeper:
      - "苦力怕！<owner>，快跑！"
      - "离它远点，<owner>！"
      - "我来引开它！快走！"
    owner_returned:
      - "你回来了！！！"
      - "<owner>！我一直在这里等你！"
      - "我就知道你会回来！"
      - "我好想好想你！"
    in_nether:
      - "好可怕的地方。我会紧跟着你。"
      - "你去哪我就去哪。这里也一样。"
      - "小心，<owner>。地上全是岩浆。"
    in_end:
      - "别看那些高个子，<owner>。"
      - "不管这是哪里，我都陪着你。"
      - "在这里我会守住你的背后。"
    in_water:
      - "我来了，<owner>！"
      - "一起游泳！"
      - "为了你，我能游过大海。"
    owner_holds_food:
      - "那是给我的吗？不给也没关系。"
      - "不管是什么，我都会喜欢。"
      - "我也愿意把我的分给你哦。"
      - "你总是知道我喜欢什么。"
    owner_hungry:
      - "<owner>，你得吃点东西。"
      - "求你吃点吧。我很担心你。"
      - "你喂我。那谁喂你呢？"
    sitting_long:
      - "还坐着。就像你吩咐的那样。"
      - "我一动都没动。真的。"
      - "我用生命守护这个位置。"
    owner_sleeping:
      - "好好睡吧。我来守夜。"
      - "今晚什么都别想溜过去。"
      - "晚安，<owner>。"
    in_boat:
      - "<owner> 船长，准备起航！"
      - "我是你的大副！"
      - "你划到哪，我就去哪。"
    leashed:
      - "不用拴我。我永远不会走。"
      - "带路吧，<owner>！"
      - "和 <owner> 散步！最棒的一天。"
    thunder:
      - "别怕，<owner>。我在这里。"
      - "天空好吵。我会保护你。"
      - "待在屋里，<owner>！"
    rain:
      - "下雨也挡不住我们。"
      - "湿了，但有你在。值了。"
      - "我待会再抖干。抖在你身上。"
    owner_flying:
      - "平安下来哦，<owner>！"
      - "在上面要小心！"
      - "我就在这里等。抬头看着你。"
    night:
      - "天黑了。我在站岗。"
      - "今晚待在我身边，<owner>。"
      - "夜班开始。保护 <owner>。"
    dawn:
      - "早上好，<owner>！"
      - "我们熬过了这一夜！"
      - "新的一天，还是最好的朋友。"
    ridden:
      - "抓紧了，<owner>！"
      - "我会安全把你送到。"
      - "告诉我去哪，我就跑。"
      - "能载着你，我很骄傲。"
    high_altitude:
      - "边上小心，<owner>。"
      - "好高。靠近我。"
      - "我会跟你一起登上世界之巅。"
    underground:
      - "好黑。我走前面。"
      - "在隧道里跟在我后面。"
      - "我听到了什么。我准备好了。"
    cold_biome:
      - "好冷！靠过来，我很暖和。"
      - "我来给你取暖，<owner>。"
      - "下雪也挡不住我们。"
    hot_biome:
      - "好热。你有水吗，<owner>？"
      - "我走在你的影子里。"
      - "太热了，但我不会走。"
    friend_nearby:
      - "<friend> 和我一起守护你。"
      - "好搭档，<friend>。"
      - "<friend> 也是家人。"
    idle:
      - "我爱 <owner>。"
      - "世界上。最好的。主人。"
      - "你需要什么吗，<owner>？"
      - "能在这里就很开心。"
      - "你去哪，我就去哪。"
      - "守护 <owner>。一如既往。"
      - "<owner> 还好吗？还好。太好了。"
      - "为了 <owner> 我什么都愿意做。"
      - "今天很美好。因为有你。"
    tamed:
      - "我选择你。永远。"
      - "你和我，<owner>。永远。"
      - "我永远不会离开你身边。"
    fed:
      - "谢谢你，<owner>！"
      - "你总是这么照顾我。"
      - "好吃。我爱你。"
      - "现在我有力气保护你了。"
    petted:
      - "我也爱你，<owner>！"
      - "最棒的。一天。没有之一。"
      - "别停！"
      - "这就是我守护你的原因。"
    pet_hurt:
      - "哎哟！我没事！我没事！"
      - "想打倒我可没那么容易。"
      - "只是有一点点疼。"
    hit_by_owner:
      - "是不小心的吧。我知道。"
      - "我原谅你，<owner>。"
      - "我还是爱你。"
    pet_killed_mob:
      - "它不会再烦你了。"
      - "<owner> 安全了。任务完成。"
      - "谁也不准威胁我的人类。"
    owner_killed_mob:
      - "打得漂亮，<owner>！"
      - "这才是我的人类！"
      - "我们真是好搭档。"
    owner_hurt:
      - "<owner>！你没事吧？！"
      - "是谁把你弄成这样的？！"
      - "躲到我身后！"
    owner_died:
      - "<owner>？！<owner>！！！"
      - "不……我应该保护你的。"
      - "我会在这里等你回来。"
    owner_ate:
      - "很好。你需要体力。"
      - "多吃点，<owner>。"
      - "看你吃东西我就放心了。"
    owner_fished:
      - "钓得好，<owner>！"
      - "你真厉害。"
      - "和你一起钓鱼最开心了。"
    owner_found_treasure:
      - "你找到了！我就知道！"
      - "闪闪发光！这是你应得的。"
      - "挖了这么久，终于有回报了！"
    owner_advancement:
      - "我真为你骄傲！"
      - "你做到了，<owner>！"
      - "我一直相信你。"
    sat_down:
      - "坐下了。我会等你。"
      - "我就在这里。"
      - "早点回来，好吗？"
    stood_up:
      - "冒险时间到！"
      - "你准备好我就出发！"
      - "走吧，<owner>！"
    teleported:
      - "找到你了！"
      - "想甩掉我可没那么容易。"
      - "我在这！我在这！"
    had_baby:
      - "看，<owner>！一个小宝宝！"
      - "我会教它保护你。"
      - "我们的家庭壮大了。"
    music:
      - "这是我们的歌，<owner>！"
      - "你开心我就开心。"
      - "和你一起跳舞！"
    explosion:
      - "<owner>！你受伤了吗？！"
      - "快离开那里！"
      - "我挡在你和爆炸之间！"

  # -------------------------------------------------------------- DRAMA
  drama:
    pet_on_fire:
