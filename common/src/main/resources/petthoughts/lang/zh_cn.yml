    thunder:
      - "天要裂开了！"
      - "世界末日到了！"
      - "快把我藏起来！"
    rain:
      - "我要融化了！"
      - "天空在哭。我也在哭。"
      - "毁了。我的造型全毁了。"
    owner_flying:
      - "快下来！你会摔下来的！"
      - "我不敢看！我在看。"
      - "人类本来就不该飞！"
    night:
      - "黑暗终将吞噬我们所有人。"
      - "天黑了。怪物们都知道。"
      - "我们撑不到早上了。"
    dawn:
      - "我们活下来了！简直不敢相信！"
      - "太阳！我以为再也见不到它了！"
      - "又是一天。这是奇迹。"
    ridden:
