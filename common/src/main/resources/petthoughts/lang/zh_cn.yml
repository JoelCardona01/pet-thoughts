      - "好高！我头晕！"
      - "一步踩错就全完了！"
    underground:
      - "被活埋了！"
      - "墙在往里挤！"
      - "我什么都看不见！我瞎了！"
    cold_biome:
      - "我要冻死了！"
      - "我感觉不到我的腿了！"
      - "告诉大家我是冻死的。"
    hot_biome:
      - "我要被煮熟了！"
