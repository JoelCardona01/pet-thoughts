# ----------------------------------------------------------------------
#  Pet Thoughts - 简体中文
#
#  所有文本都使用 MiniMessage 格式 (https://docs.advntr.dev/minimessage/)。
#  任何想法里都可以使用的变量：
#    <owner>   主人的名字
#    <pet>     宠物的名字（没有名字时为物种名）
#    <mob>     相关的怪物 / 生物
#    <friend>  附近的另一只宠物
#    <food>    相关的食物
#
#  想法从  thoughts.<性格>.<触发器>  中随机选择。
#  species.<物种>.<触发器>  中的台词会混入该物种的想法。
#  可以随意添加、修改或删除台词。空列表 ([]) 会让该组合保持安静。
#  使用 /petthoughts reload 重新加载。
# ----------------------------------------------------------------------

messages:
  prefix: "<gray>[<white>💭</white>]</gray> "
  no-permission: "<red>你没有权限这样做。"
  players-only: "<red>只有玩家可以使用此命令。"
  look-at-pet: "<red>请看向一只已驯服的宠物（8 格以内）。"
  not-your-pet: "<red>那不是你的宠物。"
  toggle-off: "<yellow>已隐藏想法气泡。你的宠物仍在思考，只是你看不到。"
  toggle-on: "<green>想法气泡已重新显示。"
  mute-on: "<yellow><pet> 会把想法藏在心里。"
  mute-off: "<green><pet> 又开始分享想法了。"
  set-done: "<green><pet> 现在是 <white><personality></white>。"
  unknown-personality: "<red>未知的性格。可选：<white><list>"
  unknown-trigger: "<red>未知的触发器。按 Tab 查看全部。"
  test-done: "<gray>已对 <pet> 强制触发 <white><trigger></white>。"
  test-no-line: "<red>语言文件中没有 <white><trigger></white> 的台词。"
  reloaded: "<green>配置和语言已重新加载。"
  # 驯服宠物时显示在快捷栏上方。留空 ("") 即可关闭。
  tamed-hint: "<white><pet></white> <gray>的性格是：</gray><yellow><personality>"
  help:
    header: "<white>💭 <bold>Pet Thoughts</bold>"
    toggle: "<yellow>/<label> toggle <gray>- 为自己隐藏或显示想法气泡"
    info: "<yellow>/<label> info <gray>- 查看你看着的宠物的性格和心情"
    mute: "<yellow>/<label> mute <gray>- 让你看着的宠物安静（或重新说话）"
    petting: "<gray>看着你的宠物并按 <white>F</white>（交换双手）来抚摸它 <red>❤"
    set: "<yellow>/<label> set <personality> <gray>- 更改你看着的宠物的性格"
    test: "<yellow>/<label> test <trigger> <gray>- 强制产生一个想法"
    reload: "<yellow>/<label> reload <gray>- 重新加载配置和语言"
  info:
    header: "<white>💭 <bold><pet></bold> <gray>（<species>）"
    personality: "<gray>性格：<yellow><personality></yellow> - <description>"
    mood: "<gray>心情：<white><mood>"
    health: "<gray>生命：<red>❤ <white><health>/<max_health>"
    last-thought: "<gray>上一个想法：<white><italic><thought>"
    no-thought: "<dark_gray>暂时没有"
    muted: "<red>已静音。<gray>使用 /pt mute 让它重新说话。"

bubble:
  # 每种想法前的小图标（支持颜色和 <bold>）。留空 = 不显示图标。
  prefix:
    thought: ""
    danger: "<#D32F2F><bold>!</bold>"
    love: "<#E0245E>❤"
    food: "<#A0522D>🍖"

