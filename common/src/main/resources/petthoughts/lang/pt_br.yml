    cold_biome:
      - "ESTOU MORRENDO CONGELADO!"
      - "Não sinto minhas pernas!"
      - "Digam que eu morri com frio."
    hot_biome:
      - "ESTOU COZINHANDO!"
      - "Água... áááágua..."
