# ----------------------------------------------------------------------
#  Pet Thoughts - Português (Brasil)
#
#  Tudo é MiniMessage (https://docs.advntr.dev/minimessage/).
#  Variáveis que você pode usar em qualquer pensamento:
#    <owner>   o nome do dono
#    <pet>     o nome do pet (ou a espécie, se não tiver nome)
#    <mob>     o monstro / mob envolvido
#    <friend>  outro pet por perto
#    <food>    a comida envolvida
#
#  Um pensamento é escolhido de  thoughts.<personalidade>.<gatilho>.
#  As falas de  species.<espécie>.<gatilho>  se misturam para essa espécie.
#  Adicione, edite ou apague quantas falas quiser. Uma lista vazia ([])
#  silencia essa combinação. Recarregue com /petthoughts reload.
# ----------------------------------------------------------------------

messages:
  prefix: "<gray>[<white>💭</white>]</gray> "
  no-permission: "<red>Você não tem permissão para fazer isso."
  players-only: "<red>Só jogadores podem usar este comando."
  look-at-pet: "<red>Olhe para um pet domesticado (até 8 blocos de distância)."
  not-your-pet: "<red>Esse pet não é seu."
  toggle-off: "<yellow>Balões de pensamento ocultos. Seus pets continuam pensando, você só não vê."
  toggle-on: "<green>Balões de pensamento visíveis de novo."
  mute-on: "<yellow><pet> vai guardar os pensamentos para si."
  mute-off: "<green><pet> voltou a compartilhar os pensamentos."
  set-done: "<green><pet> agora é <white><personality></white>."
  unknown-personality: "<red>Personalidade desconhecida. Opções: <white><list>"
  unknown-trigger: "<red>Gatilho desconhecido. Use o Tab para ver todos."
  test-done: "<gray><white><trigger></white> forçado em <pet>."
  test-no-line: "<red>Não há falas para <white><trigger></white> no arquivo de idioma."
  reloaded: "<green>Configuração e idioma recarregados."
  # Aparece acima da hotbar quando um pet é domesticado. Deixe vazio ("") para desativar.
  tamed-hint: "<white><pet></white> <gray>tem personalidade:</gray> <yellow><personality>"
  help:
    header: "<white>💭 <bold>Pet Thoughts</bold>"
    toggle: "<yellow>/<label> toggle <gray>- oculta ou mostra os balões para você"
    info: "<yellow>/<label> info <gray>- personalidade e humor do pet que você está olhando"
    mute: "<yellow>/<label> mute <gray>- silencia o pet que você está olhando (ou deixa falar de novo)"
    petting: "<gray>Olhe para o seu pet e aperte <white>F</white> (trocar de mão) para fazer carinho <red>❤"
    set: "<yellow>/<label> set <personality> <gray>- muda a personalidade do pet que você está olhando"
    test: "<yellow>/<label> test <trigger> <gray>- força um pensamento"
    reload: "<yellow>/<label> reload <gray>- recarrega a configuração e o idioma"
  info:
    header: "<white>💭 <bold><pet></bold> <gray>(<species>)"
    personality: "<gray>Personalidade: <yellow><personality></yellow> - <description>"
    mood: "<gray>Humor: <white><mood>"
    health: "<gray>Vida: <red>❤ <white><health>/<max_health>"
    last-thought: "<gray>Último pensamento: <white><italic><thought>"
    no-thought: "<dark_gray>nada ainda"
    muted: "<red>Silenciado. <gray>Use /pt mute para deixá-lo falar de novo."

bubble:
  # Ícone antes de cada tipo de pensamento (cores e <bold> funcionam). Vazio = sem ícone.
  prefix:
    thought: ""
    danger: "<#D32F2F><bold>!</bold>"
    love: "<#E0245E>❤"
    food: "<#A0522D>🍖"

