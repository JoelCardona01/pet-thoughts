      - "A melhor refeição da minha VIDA INTEIRA!"
      - "Viverei mais um dia!"
      - "Finalmente! Eu estava sumindo!"
    petted:
      - "MAIS! Fui tão negligenciado!"
      - "Vou chorar. Estou chorando."
