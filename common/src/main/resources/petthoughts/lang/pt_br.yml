# ======================================================================
#  PENSAMENTOS POR PERSONALIDADE
# ======================================================================
thoughts:

  # -------------------------------------------------------------- LOYAL
  loyal:
    pet_on_fire:
      - "Estou bem! <owner> está seguro?!"
      - "Quente! Quente! Não se preocupe comigo!"
      - "Queima, mas eu fico com você!"
    pet_low_health:
      - "Ainda posso lutar por você..."
      - "Dói, mas não vou te deixar."
      - "Não se preocupe comigo, <owner>."
      - "Só um arranhão. Um grande."
    owner_low_health:
      - "<owner>, fica atrás de mim!"
      - "Você está ferido! Fica perto!"
      - "Por favor, fique bem, <owner>."
      - "Ninguém mais encosta em <owner>!"
    hostile_nearby:
      - "Eu vou te proteger!"
      - "Para trás, <mob>!"
      - "<mob>! Fica atrás de mim, <owner>!"
      - "Não enquanto eu estiver aqui."
      - "Deixa comigo, <owner>."
    hostile_creeper:
      - "Creeper! <owner>, CORRE!"
      - "Fica longe dele, <owner>!"
      - "Eu distraio ele! Vai!"
    owner_returned:
      - "VOCÊ VOLTOU!!!"
      - "<owner>! Eu esperei bem aqui!"
      - "Eu sabia que você ia voltar!"
      - "Senti TANTO a sua falta!"
    in_nether:
      - "Lugar assustador. Vou ficar perto."
      - "Te sigo a qualquer lugar. Até aqui."
      - "Cuidado, <owner>. O chão é lava."
    in_end:
      - "Não olhe para os altos, <owner>."
      - "Onde quer que seja, estou com você."
      - "Eu cuido das suas costas aqui."
    in_water:
      - "Estou indo, <owner>!"
      - "Nadando juntos!"
      - "Eu cruzaria um oceano por você."
    owner_holds_food:
      - "É pra mim? Sem pressão."
      - "Seja o que for, vou amar."
      - "Eu dividiria a minha com você, sabia?"
      - "Você sempre sabe do que eu gosto."
    owner_hungry:
      - "<owner>, você precisa comer algo."
      - "Come, por favor. Eu me preocupo."
      - "Você me alimenta. Quem alimenta você?"
    sitting_long:
      - "Ainda sentado. Como você pediu."
      - "Não me mexi. Prometo."
      - "Guardando este lugar com a minha vida."
    owner_sleeping:
      - "Dorme bem. Estou de vigia."
      - "Nada passa por mim esta noite."
      - "Boa noite, <owner>."
    in_boat:
      - "Capitão <owner>, pronto para zarpar!"
      - "Sou seu imediato!"
      - "Para onde você remar, eu vou."
    leashed:
      - "Não precisa disso. Eu nunca iria embora."
      - "Vai na frente, <owner>!"
      - "Um passeio com <owner>! Melhor dia."
    thunder:
      - "Não tenha medo, <owner>. Estou aqui."
      - "Céu barulhento. Eu te protejo."
      - "Fica dentro de casa, <owner>!"
    rain:
      - "A chuva não pode nos parar."
      - "Molhado, mas com você. Vale a pena."
      - "Depois eu me sacudo. Em você."
    owner_flying:
      - "Desce em segurança, <owner>!"
      - "Cuidado aí em cima!"
      - "Espero bem aqui. Olhando pra cima."
    night:
      - "Está escuro. Estou de guarda."
      - "Fica perto de mim esta noite, <owner>."
      - "Turno da noite. Protegendo <owner>."
    dawn:
      - "Bom dia, <owner>!"
      - "Sobrevivemos à noite!"
      - "Dia novo, mesmo melhor amigo."
    ridden:
      - "Segura firme, <owner>!"
      - "Eu te levo em segurança."
      - "Diz pra onde e eu corro."
      - "Orgulho de te carregar."
    high_altitude:
      - "Cuidado com a beirada, <owner>."
      - "É alto. Fica perto de mim."
      - "Te sigo até o topo do mundo."
    underground:
      - "Está escuro. Eu vou primeiro."
      - "Fica atrás de mim nos túneis."
      - "Ouço coisas. Estou pronto."
    cold_biome:
      - "Frio! Chega mais, eu estou quentinho."
      - "Eu te esquento, <owner>."
      - "A neve não pode nos parar."
    hot_biome:
      - "Calor. Você tem água, <owner>?"
      - "Vou andar na sua sombra."
      - "Quente demais, mas não vou embora."
    friend_nearby:
      - "<friend> e eu estamos te protegendo."
      - "Boa equipe, <friend>."
      - "<friend> também é da família."
    idle:
      - "Eu amo <owner>."
      - "Melhor. Dono. Do mundo."
      - "Precisa de algo, <owner>?"
      - "Só feliz de estar aqui."
      - "Onde você for, eu vou."
      - "Protegendo <owner>. Como sempre."
      - "<owner> está bem? Sim. Ótimo."
      - "Eu faria tudo por <owner>."
      - "Hoje foi bom. Você estava nele."
    tamed:
      - "Eu escolho você. Para sempre."
      - "Você e eu, <owner>. Sempre."
      - "Nunca vou sair do seu lado."
    fed:
      - "Obrigado, <owner>!"
      - "Você sempre cuida de mim."
      - "Delicioso. Eu te amo."
      - "Agora estou forte para te proteger."
    petted:
      - "Eu também te amo, <owner>!"
      - "Melhor. Dia. Da vida."
      - "Não para!"
      - "É por isso que eu te protejo."
    pet_hurt:
      - "Ai! Estou bem! Estou bem!"
      - "Vão ter que se esforçar mais."
      - "Só dói um pouquinho."
    hit_by_owner:
      - "Foi sem querer. Eu sei."
      - "Eu te perdoo, <owner>."
      - "Ainda te amo."
    pet_killed_mob:
      - "Não vai mais te incomodar."
      - "<owner> está seguro. Missão cumprida."
      - "Ninguém ameaça o meu humano."
    owner_killed_mob:
      - "Belo golpe, <owner>!"
      - "Esse é o meu humano!"
      - "Somos uma boa equipe."
    owner_hurt:
      - "<owner>! Você está bem?!"
      - "Quem fez isso com você?!"
      - "Fica atrás de mim!"
    owner_died:
      - "<owner>?! <owner>!!!"
      - "Não... eu devia te proteger."
      - "Vou esperar aqui até você voltar."
    owner_ate:
      - "Isso. Você precisa de forças."
      - "Come bem, <owner>."
      - "Fico feliz que você está comendo."
    owner_fished:
      - "Bela pescaria, <owner>!"
      - "Você é muito bom nisso."
      - "Pescar com você é o melhor."
    owner_found_treasure:
      - "Você achou! Eu sabia!"
      - "Brilhante! Você merece."
      - "Toda essa escavação valeu a pena!"
    owner_advancement:
      - "Tenho tanto orgulho de você!"
      - "Você conseguiu, <owner>!"
      - "Eu sempre acreditei em você."
    sat_down:
      - "Sentado. Vou te esperar."
      - "Estarei bem aqui."
      - "Volta logo, tá?"
    stood_up:
      - "Hora da aventura!"
      - "Pronto quando você estiver!"
      - "Vamos, <owner>!"
    teleported:
      - "Te achei!"
      - "Não vai se livrar de mim tão fácil."
      - "Estou aqui! Estou aqui!"
    had_baby:
      - "Olha, <owner>! Um filhotinho!"
      - "Vou ensinar ele a te proteger."
      - "Nossa família está crescendo."
    music:
      - "Nossa música, <owner>!"
      - "Eu gosto quando você está feliz."
      - "Dançando com você!"
    explosion:
      - "<owner>! Você se machucou?!"
      - "Sai daí!"
      - "Estou entre você e a explosão!"

  # -------------------------------------------------------------- DRAMA
  drama:
    pet_on_fire:
      - "ESTOU PEGANDO FOGO! LITERALMENTE!"
      - "CONTEM A MINHA HISTÓRIA!"
      - "ENTÃO É ASSIM QUE EU VOU. CROCANTE."
    pet_low_health:
      - "Estou vendo a luz..."
      - "Digam a <owner>... que eu fui fabuloso."
      - "ESTE É O MEU FIM."
      - "Me vinguem!"
    owner_low_health:
      - "NEM PENSE EM MORRER!"
      - "QUEM VAI ME ALIMENTAR SE VOCÊ MORRER?!"
      - "<owner>! FICA COMIGO!"
      - "ASSIM NÃO!"
    hostile_nearby:
      - "É ASSIM QUE TUDO ACABA."
      - "Um <mob>! ESTAMOS PERDIDOS!"
      - "SOU JOVEM DEMAIS PRA ISSO!"
      - "SALVEM-SE!"
      - "<mob>! NÃO CONSIGO OLHAR!"
    hostile_creeper:
      - "VAI EXPLODIR! TODOS NÓS VAMOS!"
      - "UM CREEPER! ADEUS, MUNDO CRUEL!"
      - "O VERDE NÃO!"
    owner_returned:
      - "ACHEI QUE VOCÊ TINHA MORRIDO!"
      - "ANOS! VOCÊ SUMIU POR ANOS!"
      - "Você me ABANDONOU. Mas voltou!"
      - "NUNCA MAIS FAÇA ISSO."
    in_nether:
      - "ESTAMOS NO INFERNO. INFERNO DE VERDADE."
      - "TUDO ESTÁ PEGANDO FOGO!"
      - "Minha beleza! O calor!"
    in_end:
      - "O FIM?! QUEM DEU ESSE NOME?!"
      - "NÃO TEM NADA lá embaixo!"
      - "Isso é literalmente o fim."
    in_water:
      - "ESTOU ME AFOGANDO! Ah, eu sei nadar."
      - "MEU CABELO!"
      - "HOMEM AO MAR! SOU EU!"
    owner_holds_food:
      - "É PRA MIM?!"
      - "Estou MORRENDO de fome. Vou desmaiar."
      - "Me dá ou eu pereço."
      - "Não como há MINUTOS."
    owner_hungry:
      - "Você está definhando, <owner>!"
      - "COME! Antes que seja tarde!"
      - "Dá pra ouvir seu estômago daqui!"
    sitting_long:
      - "Fui abandonado. Aqui. Para sempre."
      - "Minhas pernas esqueceram como andar."
      - "Vão achar meu esqueleto sentado aqui."
    owner_sleeping:
      - "E agora estou sozinho no escuro. Ótimo."
      - "E se <owner> nunca mais acordar?!"
