    friend_nearby:
      - "<friend> está roubando meus holofotes."
      - "<friend>, me abraça. Estou sobrecarregado."
      - "Pelo menos <friend> me entende."
    idle:
      - "Ninguém olha pra mim há séculos."
      - "Estou entediado. Posso morrer disso."
      - "Alguém sequer me ama?"
      - "Minha vida é TÃO difícil."
      - "Algo terrível vai acontecer. Eu sinto."
      - "<owner> piscou pra mim. O que SIGNIFICA?"
      - "Eu sou o protagonista."
      - "Não ganho carinho há UMA ETERNIDADE."
      - "Suspiro. SUSPIRO. Alguém ouve meu suspiro?"
    tamed:
      - "FINALMENTE! Alguém que me merece!"
      - "É o destino. Estou chorando."
      - "Pode me adorar agora."
    fed:
