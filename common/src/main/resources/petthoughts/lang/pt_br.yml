      - "Não consigo olhar! Estou olhando."
      - "Gente não foi feita pra VOAR!"
    night:
      - "A escuridão vem para todos nós."
      - "É noite. Os monstros sabem."
      - "Não vamos sobreviver até de manhã."
    dawn:
      - "SOBREVIVEMOS! Não acredito!"
      - "O sol! Achei que nunca mais ia vê-lo!"
