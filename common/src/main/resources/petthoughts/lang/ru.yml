# ----------------------------------------------------------------------
#  Pet Thoughts - Русский
#
#  Всё в формате MiniMessage (https://docs.advntr.dev/minimessage/).
#  Переменные, которые можно использовать в любой мысли:
#    <owner>   имя хозяина
#    <pet>     кличка питомца (или его вид, если клички нет)
#    <mob>     монстр / моб
#    <friend>  другой питомец рядом
#    <food>    еда
#
#  Мысль выбирается из  thoughts.<характер>.<событие>.
#  Строки из  species.<вид>.<событие>  подмешиваются для этого вида.
#  Добавляйте, меняйте и удаляйте строки как угодно. Пустой список ([])
#  отключает это сочетание. Перезагрузка: /petthoughts reload.
# ----------------------------------------------------------------------

messages:
  prefix: "<gray>[<white>💭</white>]</gray> "
  no-permission: "<red>У вас нет прав на это."
  players-only: "<red>Эту команду могут использовать только игроки."
  look-at-pet: "<red>Посмотрите на приручённого питомца (до 8 блоков)."
  not-your-pet: "<red>Это не ваш питомец."
  toggle-off: "<yellow>Облачка мыслей скрыты. Питомцы всё ещё думают, просто вы этого не видите."
  toggle-on: "<green>Облачка мыслей снова видны."
  mute-on: "<yellow><pet> будет держать мысли при себе."
  mute-off: "<green><pet> снова делится мыслями."
  set-done: "<green>Характер <pet>: <white><personality></white>."
  unknown-personality: "<red>Неизвестный характер. Варианты: <white><list>"
  unknown-trigger: "<red>Неизвестное событие. Нажмите Tab, чтобы увидеть все."
  test-done: "<gray>Событие <white><trigger></white> вызвано у <pet>."
  test-no-line: "<red>В языковом файле нет строк для <white><trigger></white>."
  reloaded: "<green>Настройки и язык перезагружены."
  # Показывается над панелью быстрого доступа при приручении. Оставьте пустым (""), чтобы отключить.
  tamed-hint: "<white><pet></white> <gray>— характер:</gray> <yellow><personality>"
  help:
    header: "<white>💭 <bold>Pet Thoughts</bold>"
    toggle: "<yellow>/<label> toggle <gray>- скрыть или показать облачка для себя"
    info: "<yellow>/<label> info <gray>- характер и настроение питомца, на которого вы смотрите"
    mute: "<yellow>/<label> mute <gray>- заставить замолчать питомца, на которого вы смотрите (или разрешить снова)"
    petting: "<gray>Посмотрите на питомца и нажмите <white>F</white> (сменить руку), чтобы погладить его <red>❤"
    set: "<yellow>/<label> set <personality> <gray>- изменить характер питомца, на которого вы смотрите"
    test: "<yellow>/<label> test <trigger> <gray>- вызвать мысль"
    reload: "<yellow>/<label> reload <gray>- перезагрузить настройки и язык"
  info:
    header: "<white>💭 <bold><pet></bold> <gray>(<species>)"
    personality: "<gray>Характер: <yellow><personality></yellow> - <description>"
    mood: "<gray>Настроение: <white><mood>"
    health: "<gray>Здоровье: <red>❤ <white><health>/<max_health>"
    last-thought: "<gray>Последняя мысль: <white><italic><thought>"
    no-thought: "<dark_gray>пока ничего"
    muted: "<red>Молчит. <gray>Используйте /pt mute, чтобы разрешить ему говорить."

bubble:
  # Значок перед каждым типом мысли (цвета и <bold> работают). Пусто = без значка.
  prefix:
    thought: ""
    danger: "<#D32F2F><bold>!</bold>"
    love: "<#E0245E>❤"
    food: "<#A0522D>🍖"

# Используется, когда в строке есть переменная, которая не подходит к ситуации.
