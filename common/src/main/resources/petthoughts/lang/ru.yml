# ======================================================================
#  МЫСЛИ ПО ХАРАКТЕРУ
# ======================================================================
thoughts:

  # -------------------------------------------------------------- LOYAL
  loyal:
    pet_on_fire:
      - "Я в порядке! <owner> в безопасности?!"
      - "Горячо! Горячо! Не волнуйся за меня!"
      - "Жжёт, но я остаюсь с тобой!"
    pet_low_health:
      - "Я ещё могу сражаться за тебя..."
      - "Больно, но я тебя не брошу."
      - "Не волнуйся за меня, <owner>."
      - "Просто царапина. Большая."
    owner_low_health:
      - "<owner>, встань за мной!"
      - "Ты ранен! Держись рядом!"
      - "Пожалуйста, будь в порядке, <owner>."
      - "Больше никто не тронет <owner>!"
    hostile_nearby:
      - "Я тебя защищу!"
      - "Назад, <mob>!"
      - "<mob>! За меня, <owner>!"
      - "Только не при мне."
      - "Я разберусь, <owner>."
    hostile_creeper:
      - "Крипер! <owner>, БЕГИ!"
      - "Держись от него подальше, <owner>!"
      - "Я его отвлеку! Беги!"
    owner_returned:
      - "ТЫ ВЕРНУЛСЯ!!!"
      - "<owner>! Я ждал прямо здесь!"
      - "Я знал, что ты вернёшься!"
      - "Я ТАК скучал!"
    in_nether:
      - "Страшное место. Буду рядом."
      - "Пойду за тобой куда угодно. Даже сюда."
      - "Осторожно, <owner>. Пол — это лава."
    in_end:
      - "Не смотри на высоких, <owner>."
      - "Где бы мы ни были, я с тобой."
      - "Я прикрою тебе спину."
    in_water:
      - "Плыву, <owner>!"
      - "Плаваем вместе!"
      - "Ради тебя я переплыл бы океан."
    owner_holds_food:
      - "Это мне? Без давления."
      - "Что бы там ни было, мне понравится."
      - "Я бы поделился своим с тобой, знаешь."
      - "Ты всегда знаешь, что я люблю."
    owner_hungry:
      - "<owner>, тебе нужно поесть."
      - "Поешь, пожалуйста. Я волнуюсь."
      - "Ты кормишь меня. А кто кормит тебя?"
    sitting_long:
      - "Всё ещё сижу. Как ты просил."
      - "Я не сдвинулся. Честно."
      - "Охраняю это место ценой жизни."
    owner_sleeping:
      - "Спи спокойно. Я на страже."
      - "Этой ночью мимо меня никто не пройдёт."
      - "Спокойной ночи, <owner>."
    in_boat:
      - "Капитан <owner>, к отплытию готов!"
      - "Я твой старпом!"
      - "Куда ты гребёшь, туда и я."
    leashed:
      - "Это не нужно. Я бы никогда не ушёл."
      - "Веди, <owner>!"
      - "Прогулка с <owner>! Лучший день."
    thunder:
      - "Не бойся, <owner>. Я здесь."
      - "Небо шумит. Я тебя защищу."
      - "Оставайся в укрытии, <owner>!"
    rain:
      - "Дождь нас не остановит."
      - "Мокрый, но с тобой. Оно того стоит."
      - "Отряхнусь потом. На тебя."
    owner_flying:
      - "Спускайся осторожно, <owner>!"
      - "Осторожнее там наверху!"
      - "Подожду здесь. Глядя вверх."
    night:
      - "Темно. Я на посту."
      - "Держись рядом этой ночью, <owner>."
      - "Ночная смена. Охраняю <owner>."
    dawn:
      - "Доброе утро, <owner>!"
      - "Мы пережили ночь!"
      - "Новый день, тот же лучший друг."
    ridden:
      - "Держись крепче, <owner>!"
      - "Довезу тебя в целости."
      - "Скажи куда, и я побегу."
      - "Горжусь, что везу тебя."
    high_altitude:
      - "Осторожно у края, <owner>."
      - "Высоко. Держись рядом."
      - "Пойду за тобой хоть на вершину мира."
    underground:
      - "Темно. Я пойду первым."
      - "Держись за мной в туннелях."
      - "Я что-то слышу. Я готов."
    cold_biome:
      - "Холодно! Иди ближе, я тёплый."
      - "Я тебя согрею, <owner>."
      - "Снег нас не остановит."
    hot_biome:
      - "Жарко. У тебя есть вода, <owner>?"
      - "Пойду в твоей тени."
      - "Слишком жарко, но я не уйду."
    friend_nearby:
      - "Мы с <friend> охраняем тебя."
      - "Хорошая команда, <friend>."
      - "<friend> тоже семья."
    idle:
      - "Я люблю <owner>."
      - "Лучший. Хозяин. На свете."
      - "Тебе что-нибудь нужно, <owner>?"
      - "Просто рад быть здесь."
      - "Куда ты, туда и я."
      - "Охраняю <owner>. Как обычно."
      - "<owner> в порядке? Да. Хорошо."
      - "Я сделаю для <owner> что угодно."
      - "Сегодня был хороший день. Ты был в нём."
    tamed:
      - "Я выбираю тебя. Навсегда."
      - "Ты и я, <owner>. Всегда."
      - "Я никогда не отойду от тебя."
    fed:
      - "Спасибо, <owner>!"
      - "Ты всегда обо мне заботишься."
      - "Вкусно. Я тебя люблю."
      - "Теперь я достаточно силён, чтобы защищать тебя."
    petted:
      - "Я тоже тебя люблю, <owner>!"
      - "Лучший. День. В жизни."
      - "Не останавливайся!"
      - "Вот поэтому я тебя охраняю."
    pet_hurt:
      - "Ай! Я в порядке! В порядке!"
      - "Им придётся постараться получше."
      - "Совсем чуть-чуть больно."
    hit_by_owner:
      - "Это случайно. Я знаю."
      - "Я тебя прощаю, <owner>."
      - "Я всё равно тебя люблю."
    pet_killed_mob:
      - "Больше он тебя не побеспокоит."
      - "<owner> в безопасности. Готово."
      - "Никто не угрожает моему человеку."
    owner_killed_mob:
      - "Отличный удар, <owner>!"
      - "Вот это мой человек!"
      - "Мы хорошая команда."
    owner_hurt:
      - "<owner>! Ты в порядке?!"
      - "Кто это с тобой сделал?!"
      - "Встань за мной!"
    owner_died:
      - "<owner>?! <owner>!!!"
      - "Нет... я должен был тебя защитить."
      - "Буду ждать здесь, пока ты не вернёшься."
    owner_ate:
      - "Хорошо. Тебе нужны силы."
      - "Ешь как следует, <owner>."
      - "Я рад, что ты ешь."
    owner_fished:
      - "Отличный улов, <owner>!"
      - "У тебя так здорово получается."
      - "Рыбачить с тобой — лучше всего."
    owner_found_treasure:
      - "Ты нашёл! Я знал, что найдёшь!"
      - "Блестит! Ты это заслужил."
      - "Все эти раскопки окупились!"
    owner_advancement:
      - "Я так тобой горжусь!"
      - "У тебя получилось, <owner>!"
      - "Я всегда в тебя верил."
    sat_down:
      - "Сижу. Подожду тебя."
      - "Я буду прямо здесь."
      - "Возвращайся скорее, ладно?"
    stood_up:
      - "Время приключений!"
      - "Готов, когда ты готов!"
      - "Пойдём, <owner>!"
    teleported:
      - "Нашёл тебя!"
      - "Так просто ты от меня не отделаешься."
      - "Я здесь! Я здесь!"
    had_baby:
      - "Смотри, <owner>! Малыш!"
      - "Я научу его защищать тебя."
      - "Наша семья растёт."
    music:
      - "Наша песня, <owner>!"
      - "Мне нравится, когда ты счастлив."
      - "Танцую с тобой!"
    explosion:
      - "<owner>! Ты ранен?!"
      - "Уходи оттуда!"
      - "Я между тобой и взрывом!"

  # -------------------------------------------------------------- DRAMA
  drama:
    pet_on_fire:
