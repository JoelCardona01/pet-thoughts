      - "РАССКАЖИТЕ МОЮ ИСТОРИЮ!"
      - "ТАК ВОТ КАК Я УЙДУ. ХРУСТЯЩИМ."
    pet_low_health:
      - "Я вижу свет..."
      - "Передайте <owner>... я был великолепен."
      - "ЭТО МОЙ КОНЕЦ."
      - "Отомстите за меня!"
    owner_low_health:
      - "НЕ СМЕЙ УМИРАТЬ!"
      - "КТО БУДЕТ МЕНЯ КОРМИТЬ, ЕСЛИ ТЫ УМРЁШЬ?!"
      - "<owner>! ОСТАНЬСЯ СО МНОЙ!"
      - "НЕ ТАК!"
    hostile_nearby:
      - "ВОТ ТАК ВСЁ И ЗАКОНЧИТСЯ."
      - "<mob>! МЫ ОБРЕЧЕНЫ!"
      - "Я СЛИШКОМ МОЛОД ДЛЯ ЭТОГО!"
      - "СПАСАЙСЯ КТО МОЖЕТ!"
      - "<mob>! Я НЕ МОГУ НА ЭТО СМОТРЕТЬ!"
    hostile_creeper:
      - "ОН ВЗОРВЁТСЯ! МЫ ВСЕ ВЗОРВЁМСЯ!"
      - "КРИПЕР! ПРОЩАЙ, ЖЕСТОКИЙ МИР!"
      - "ТОЛЬКО НЕ ЗЕЛЁНЫЙ!"
    owner_returned:
      - "Я ДУМАЛ, ТЫ УМЕР!"
      - "ГОДЫ! ТЕБЯ НЕ БЫЛО ГОДАМИ!"
      - "Ты меня БРОСИЛ. Но вернулся!"
      - "НИКОГДА БОЛЬШЕ ТАК НЕ ДЕЛАЙ."
    in_nether:
      - "МЫ В АДУ. В НАСТОЯЩЕМ АДУ."
      - "ВСЁ ГОРИТ!"
      - "Моя красота! Эта жара!"
    in_end:
      - "КРАЙ?! КТО ТАК НАЗВАЛ ЭТО МЕСТО?!"
      - "Там внизу НИЧЕГО нет!"
      - "Это буквально конец."
    in_water:
      - "Я ТОНУ! А, я умею плавать."
      - "МОЯ ПРИЧЁСКА!"
      - "ЧЕЛОВЕК ЗА БОРТОМ! ЭТО Я!"
    owner_holds_food:
      - "ЭТО МНЕ?!"
      - "Я УМИРАЮ от голода. Сейчас упаду в обморок."
      - "Дай мне это, или я погибну."
      - "Я не ел уже НЕСКОЛЬКО МИНУТ."
    owner_hungry:
      - "Ты чахнешь, <owner>!"
      - "ЕШЬ! Пока не поздно!"
      - "Я слышу твой живот отсюда!"
    sitting_long:
      - "Меня бросили. Здесь. Навсегда."
      - "Мои лапы забыли, как ходить."
      - "Здесь найдут мой сидящий скелет."
    owner_sleeping:
      - "И вот я один в темноте. Отлично."
      - "А что, если <owner> никогда не проснётся?!"
