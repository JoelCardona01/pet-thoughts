# ----------------------------------------------------------------------
#  Pet Thoughts - Deutsch
#
#  Alles ist MiniMessage (https://docs.advntr.dev/minimessage/).
#  Variablen für jeden Gedanken:
#    <owner>   der Name des Besitzers
#    <pet>     der Name des Tieres (oder seine Art, wenn es keinen hat)
#    <mob>     das beteiligte Monster / der Mob
#    <friend>  ein anderes Tier in der Nähe
#    <food>    das beteiligte Essen
#
#  Ein Gedanke wird aus  thoughts.<Persönlichkeit>.<Auslöser>  gewählt.
#  Zeilen aus  species.<Art>.<Auslöser>  werden für diese Art beigemischt.
#  Füge so viele Zeilen hinzu, ändere oder lösche sie, wie du willst. Eine
#  leere Liste ([]) schaltet die Kombination stumm. Neu laden: /petthoughts reload.
# ----------------------------------------------------------------------

messages:
  prefix: "<gray>[<white>💭</white>]</gray> "
  no-permission: "<red>Dazu hast du keine Berechtigung."
  players-only: "<red>Nur Spieler können diesen Befehl benutzen."
  look-at-pet: "<red>Schau ein gezähmtes Tier an (bis zu 8 Blöcke entfernt)."
  not-your-pet: "<red>Das ist nicht dein Tier."
  toggle-off: "<yellow>Gedankenblasen ausgeblendet. Deine Tiere denken weiter, du siehst es nur nicht."
  toggle-on: "<green>Gedankenblasen wieder sichtbar."
  mute-on: "<yellow><pet> behält seine Gedanken für sich."
  mute-off: "<green><pet> teilt seine Gedanken wieder."
  set-done: "<green><pet> ist jetzt <white><personality></white>."
  unknown-personality: "<red>Unbekannte Persönlichkeit. Optionen: <white><list>"
  unknown-trigger: "<red>Unbekannter Auslöser. Mit Tab siehst du alle."
  test-done: "<gray><white><trigger></white> bei <pet> erzwungen."
  test-no-line: "<red>Für <white><trigger></white> gibt es keine Zeilen in der Sprachdatei."
  reloaded: "<green>Konfiguration und Sprache neu geladen."
  # Wird über der Schnellleiste angezeigt, wenn ein Tier gezähmt wird. Leer ("") zum Abschalten.
  tamed-hint: "<white><pet></white> <gray>hat eine Persönlichkeit:</gray> <yellow><personality>"
  help:
    header: "<white>💭 <bold>Pet Thoughts</bold>"
    toggle: "<yellow>/<label> toggle <gray>- Gedankenblasen für dich aus- oder einblenden"
    info: "<yellow>/<label> info <gray>- Persönlichkeit und Laune des Tieres, das du ansiehst"
    mute: "<yellow>/<label> mute <gray>- das angesehene Tier stummschalten (oder wieder reden lassen)"
    petting: "<gray>Schau dein Tier an und drück <white>F</white> (Hand wechseln), um es zu streicheln <red>❤"
    set: "<yellow>/<label> set <personality> <gray>- Persönlichkeit des angesehenen Tieres ändern"
    test: "<yellow>/<label> test <trigger> <gray>- einen Gedanken erzwingen"
    reload: "<yellow>/<label> reload <gray>- Konfiguration und Sprache neu laden"
  info:
    header: "<white>💭 <bold><pet></bold> <gray>(<species>)"
    personality: "<gray>Persönlichkeit: <yellow><personality></yellow> - <description>"
    mood: "<gray>Laune: <white><mood>"
    health: "<gray>Gesundheit: <red>❤ <white><health>/<max_health>"
    last-thought: "<gray>Letzter Gedanke: <white><italic><thought>"
    no-thought: "<dark_gray>noch nichts"
    muted: "<red>Stumm. <gray>Mit /pt mute darf es wieder reden."

bubble:
  # Kleines Symbol vor jeder Gedankenart (Farben und <bold> gehen). Leer = kein Symbol.
  prefix:
    thought: ""
    danger: "<#D32F2F><bold>!</bold>"
    love: "<#E0245E>❤"
    food: "<#A0522D>🍖"

