      - "Was immer es ist, ich werde es lieben."
      - "Ich würde meins mit dir teilen, weißt du."
      - "Du weißt immer, was ich mag."
    owner_hungry:
      - "<owner>, du musst was essen."
      - "Iss bitte. Ich mach mir Sorgen."
      - "Du fütterst mich. Wer füttert dich?"
    sitting_long:
      - "Sitze immer noch. Wie du wolltest."
      - "Ich hab mich nicht bewegt. Versprochen."
      - "Ich bewache diesen Platz mit meinem Leben."
    owner_sleeping:
      - "Schlaf gut. Ich halte Wache."
      - "Heute Nacht kommt nichts an mir vorbei."
      - "Gute Nacht, <owner>."
    in_boat:
      - "Kapitän <owner>, bereit zum Ablegen!"
      - "Ich bin dein Erster Maat!"
      - "Wohin du ruderst, dahin gehe ich."
    leashed:
