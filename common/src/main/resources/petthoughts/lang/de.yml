thoughts:

  # -------------------------------------------------------------- LOYAL
  loyal:
    pet_on_fire:
      - "Mir geht's gut! Ist <owner> in Sicherheit?!"
      - "Heiß! Heiß! Mach dir keine Sorgen um mich!"
      - "Es brennt, aber ich bleibe bei dir!"
    pet_low_health:
      - "Ich kann noch für dich kämpfen..."
      - "Es tut weh, aber ich verlasse dich nicht."
      - "Mach dir keine Sorgen um mich, <owner>."
      - "Nur ein Kratzer. Ein großer."
    owner_low_health:
      - "<owner>, hinter mich!"
      - "Du bist verletzt! Bleib in der Nähe!"
      - "Bitte sei okay, <owner>."
      - "Niemand rührt <owner> mehr an!"
    hostile_nearby:
      - "Ich beschütze dich!"
      - "Zurück, <mob>!"
      - "<mob>! Hinter mich, <owner>!"
      - "Nicht solange ich da bin."
      - "Ich mach das, <owner>."
    hostile_creeper:
      - "Creeper! <owner>, LAUF!"
      - "Bleib weg von ihm, <owner>!"
      - "Ich lenke ihn ab! Geh!"
    owner_returned:
      - "DU BIST ZURÜCK!!!"
      - "<owner>! Ich hab genau hier gewartet!"
      - "Ich wusste, dass du zurückkommst!"
      - "Ich hab dich SO vermisst!"
    in_nether:
      - "Unheimlicher Ort. Ich bleib nah bei dir."
      - "Ich folge dir überallhin. Sogar hierher."
      - "Vorsicht, <owner>. Der Boden ist Lava."
    in_end:
      - "Schau die Großen nicht an, <owner>."
      - "Wo auch immer das ist, ich bin bei dir."
      - "Ich halte dir hier den Rücken frei."
    in_water:
      - "Ich komme, <owner>!"
      - "Wir schwimmen zusammen!"
      - "Für dich würde ich einen Ozean durchqueren."
    owner_holds_food:
