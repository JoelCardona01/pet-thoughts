      - "Geh voran, <owner>!"
      - "Ein Spaziergang mit <owner>! Bester Tag."
    thunder:
      - "Keine Angst, <owner>. Ich bin da."
      - "Lauter Himmel. Ich beschütze dich."
      - "Bleib drinnen, <owner>!"
    rain:
