# ======================================================================
#  PENSÉES PAR PERSONNALITÉ
# ======================================================================
thoughts:

  # -------------------------------------------------------------- LOYAL
  loyal:
    pet_on_fire:
      - "Ça va ! <owner> est en sécurité ?!"
      - "Chaud ! Chaud ! Ne t'en fais pas pour moi !"
      - "Ça brûle, mais je reste avec toi !"
    pet_low_health:
      - "Je peux encore me battre pour toi..."
      - "Ça fait mal, mais je ne te quitte pas."
      - "Ne t'inquiète pas pour moi, <owner>."
      - "Juste une égratignure. Une grosse."
    owner_low_health:
      - "<owner>, mets-toi derrière moi !"
      - "Tu es blessé ! Reste près de moi !"
      - "S'il te plaît, tiens bon, <owner>."
      - "Plus personne ne touche à <owner> !"
    hostile_nearby:
      - "Je vais te protéger !"
      - "Recule, <mob> !"
      - "<mob> ! Derrière moi, <owner> !"
      - "Pas tant que je suis là."
      - "Je m'en occupe, <owner>."
    hostile_creeper:
      - "Creeper ! <owner>, COURS !"
      - "Éloigne-toi de lui, <owner> !"
      - "Je fais diversion ! Va !"
    owner_returned:
      - "TU ES REVENU !!!"
      - "<owner> ! J'ai attendu juste ici !"
      - "Je savais que tu reviendrais !"
      - "Tu m'as TELLEMENT manqué !"
    in_nether:
      - "Endroit effrayant. Je reste près de toi."
      - "Je te suivrai partout. Même ici."
      - "Attention, <owner>. Le sol, c'est de la lave."
    in_end:
      - "Ne regarde pas les grands, <owner>."
      - "Où qu'on soit, je suis avec toi."
      - "Je surveille tes arrières ici."
    in_water:
      - "J'arrive, <owner> !"
      - "On nage ensemble !"
      - "Je traverserais un océan pour toi."
    owner_holds_food:
      - "C'est pour moi ? Sans pression."
      - "Quoi que ce soit, je vais adorer."
      - "Je partagerais le mien avec toi, tu sais."
      - "Tu sais toujours ce que j'aime."
    owner_hungry:
      - "<owner>, il faut que tu manges."
      - "Mange, s'il te plaît. Je m'inquiète."
      - "Tu me nourris. Qui te nourrit, toi ?"
    sitting_long:
      - "Toujours assis. Comme tu l'as demandé."
      - "Je n'ai pas bougé. Promis."
      - "Je garde cet endroit au péril de ma vie."
    owner_sleeping:
      - "Dors bien. Je monte la garde."
      - "Rien ne passera cette nuit."
      - "Bonne nuit, <owner>."
    in_boat:
      - "Capitaine <owner>, prêt à larguer les amarres !"
      - "Je suis ton second !"
      - "Où tu rames, je vais."
    leashed:
      - "Pas besoin de ça. Je ne partirai jamais."
      - "Montre le chemin, <owner> !"
      - "Une balade avec <owner> ! Meilleur jour."
    thunder:
      - "N'aie pas peur, <owner>. Je suis là."
      - "Le ciel gronde. Je te protège."
      - "Reste à l'abri, <owner> !"
    rain:
      - "La pluie ne nous arrêtera pas."
      - "Mouillé, mais avec toi. Ça vaut le coup."
      - "Je m'ébrouerai plus tard. Sur toi."
    owner_flying:
      - "Redescends sain et sauf, <owner> !"
      - "Fais attention là-haut !"
      - "J'attends ici. Le nez en l'air."
    night:
      - "Il fait noir. Je suis de garde."
      - "Reste près de moi cette nuit, <owner>."
      - "Service de nuit. Je protège <owner>."
    dawn:
      - "Bonjour, <owner> !"
      - "On a survécu à la nuit !"
      - "Nouveau jour, même meilleur ami."
    ridden:
      - "Accroche-toi, <owner> !"
      - "Je t'y emmène en sécurité."
      - "Dis-moi où et je cours."
      - "Fier de te porter."
    high_altitude:
      - "Attention au bord, <owner>."
      - "C'est haut. Reste près de moi."
      - "Je te suivrai jusqu'au sommet du monde."
    underground:
      - "Il fait noir. Je passe devant."
      - "Reste derrière moi dans les tunnels."
      - "J'entends des choses. Je suis prêt."
    cold_biome:
      - "Froid ! Viens près de moi, j'ai chaud."
      - "Je vais te réchauffer, <owner>."
      - "La neige ne nous arrêtera pas."
    hot_biome:
      - "Chaud. Tu as de l'eau, <owner> ?"
      - "Je marche dans ton ombre."
      - "Trop chaud, mais je ne pars pas."
    friend_nearby:
      - "<friend> et moi, on te protège."
      - "Belle équipe, <friend>."
      - "<friend> aussi fait partie de la famille."
    idle:
      - "J'aime <owner>."
      - "Meilleur. Maître. Du monde."
      - "Tu as besoin de quelque chose, <owner> ?"
      - "Juste content d'être là."
      - "Où tu vas, je vais."
      - "Je protège <owner>. Comme d'habitude."
      - "<owner> va bien ? Oui. Parfait."
      - "Je ferais tout pour <owner>."
      - "Aujourd'hui était bien. Tu étais là."
    tamed:
      - "Je te choisis. Pour toujours."
      - "Toi et moi, <owner>. Toujours."
      - "Je ne te quitterai jamais."
    fed:
      - "Merci, <owner> !"
      - "Tu prends toujours soin de moi."
      - "Délicieux. Je t'aime."
      - "Maintenant, je suis assez fort pour te protéger."
    petted:
      - "Moi aussi je t'aime, <owner> !"
      - "Meilleur. Jour. De. Ma. Vie."
      - "N'arrête pas !"
      - "C'est pour ça que je te protège."
    pet_hurt:
      - "Aïe ! Ça va ! Ça va !"
      - "Il faudra faire mieux que ça."
      - "Ça fait juste un peu mal."
    hit_by_owner:
      - "C'était un accident. Je sais."
      - "Je te pardonne, <owner>."
      - "Je t'aime quand même."
    pet_killed_mob:
      - "Il ne t'embêtera plus."
      - "<owner> est en sécurité. Mission accomplie."
      - "Personne ne menace mon humain."
    owner_killed_mob:
      - "Beau coup, <owner> !"
      - "C'est mon humain, ça !"
      - "On fait une bonne équipe."
    owner_hurt:
      - "<owner> ! Ça va ?!"
      - "Qui t'a fait ça ?!"
      - "Reste derrière moi !"
    owner_died:
      - "<owner> ?! <owner> !!!"
      - "Non... j'étais censé te protéger."
      - "J'attendrai ici jusqu'à ton retour."
    owner_ate:
      - "Bien. Tu as besoin de forces."
      - "Mange bien, <owner>."
      - "Je suis content que tu manges."
    owner_fished:
      - "Belle prise, <owner> !"
      - "Tu es tellement doué."
      - "Pêcher avec toi, c'est le top."
    owner_found_treasure:
      - "Tu l'as trouvé ! Je le savais !"
      - "Ça brille ! Tu le mérites."
      - "Tout ce creusage a payé !"
    owner_advancement:
      - "Je suis si fier de toi !"
      - "Tu l'as fait, <owner> !"
      - "J'ai toujours cru en toi."
    sat_down:
      - "Assis. Je t'attends."
      - "Je serai juste là."
      - "Reviens vite, d'accord ?"
    stood_up:
      - "C'est l'heure de l'aventure !"
      - "Prêt quand tu veux !"
      - "On y va, <owner> !"
    teleported:
      - "Je t'ai trouvé !"
      - "Tu ne te débarrasseras pas de moi si facilement."
      - "Je suis là ! Je suis là !"
    had_baby:
      - "Regarde, <owner> ! Un petit !"
      - "Je lui apprendrai à te protéger."
      - "Notre famille s'agrandit."
    music:
      - "Notre chanson, <owner> !"
      - "J'aime quand tu es heureux."
      - "Je danse avec toi !"
    explosion:
      - "<owner> ! Tu es blessé ?!"
      - "Éloigne-toi de là !"
      - "Je suis entre toi et le boum !"

  # -------------------------------------------------------------- DRAMA
  drama:
    pet_on_fire:
      - "JE BRÛLE ! LITTÉRALEMENT !"
      - "RACONTEZ MON HISTOIRE !"
      - "DONC C'EST COMME ÇA QUE JE PARS. CROUSTILLANT."
    pet_low_health:
      - "Je vois la lumière..."
      - "Dites à <owner>... que j'étais fabuleux."
      - "C'EST MA FIN."
      - "Vengez-moi !"
    owner_low_health:
      - "NE T'AVISE PAS DE MOURIR !"
      - "QUI VA ME NOURRIR SI TU MEURS ?!"
      - "<owner> ! RESTE AVEC MOI !"
      - "PAS COMME ÇA !"
    hostile_nearby:
      - "C'EST AINSI QUE TOUT FINIT."
      - "Un <mob> ! NOUS SOMMES PERDUS !"
      - "JE SUIS TROP JEUNE POUR ÇA !"
      - "SAUVEZ-VOUS !"
      - "<mob> ! JE NE PEUX PAS REGARDER !"
    hostile_creeper:
      - "IL VA EXPLOSER ! ON VA TOUS EXPLOSER !"
      - "UN CREEPER ! ADIEU, MONDE CRUEL !"
      - "PAS LE VERT !"
    owner_returned:
      - "JE TE CROYAIS MORT !"
      - "DES ANNÉES ! TU ÉTAIS PARTI DES ANNÉES !"
      - "Tu m'as ABANDONNÉ. Mais tu es revenu !"
      - "NE REFAIS PLUS JAMAIS ÇA."
    in_nether:
      - "ON EST EN ENFER. LE VRAI."
      - "TOUT EST EN FEU !"
      - "Ma beauté ! Cette chaleur !"
    in_end:
      - "LA FIN ?! QUI A NOMMÉ CET ENDROIT ?!"
      - "Il n'y a RIEN en dessous !"
      - "C'est littéralement la fin."
    in_water:
      - "JE ME NOIE ! Ah, je sais nager."
      - "MES CHEVEUX !"
      - "UN HOMME À LA MER ! C'EST MOI !"
    owner_holds_food:
      - "C'EST POUR MOI ?!"
      - "Je MEURS de faim. Je vais m'évanouir."
      - "Donne-le-moi ou je péris."
      - "Je n'ai pas mangé depuis des MINUTES."
    owner_hungry:
      - "Tu dépéris, <owner> !"
      - "MANGE ! Avant qu'il ne soit trop tard !"
      - "J'entends ton ventre d'ici !"
    sitting_long:
      - "On m'a abandonné. Ici. Pour toujours."
      - "Mes pattes ont oublié comment marcher."
      - "On retrouvera mon squelette assis ici."
    owner_sleeping:
      - "Et me voilà seul dans le noir. Super."
      - "Et si <owner> ne se réveillait jamais ?!"
      - "Bien sûr. Dors. Moi, je m'inquiète."
    in_boat:
      - "ON VA COULER !"
      - "J'ai le mal de mer ! Sûrement !"
      - "La mer prend qui elle veut..."
    leashed:
      - "ENCHAÎNÉ ! Comme un criminel !"
      - "C'est ça que je suis pour toi ?!"
      - "QUELLE HUMILIATION."
    thunder:
      - "LE CIEL SE BRISE !"
      - "C'EST LA FIN DU MONDE !"
      - "CACHE-MOI !"
    rain:
      - "Je FONDS !"
      - "Le ciel pleure. Moi aussi."
      - "RUINÉ. Mon look est RUINÉ."
    owner_flying:
      - "DESCENDS ! TU VAS TOMBER !"
      - "Je ne peux pas regarder ! Je regarde."
      - "Les gens ne sont pas faits pour VOLER !"
    night:
      - "Les ténèbres viennent pour nous tous."
      - "C'est la nuit. Les monstres le savent."
      - "On ne survivra pas jusqu'au matin."
    dawn:
      - "ON A SURVÉCU ! Je n'y crois pas !"
      - "Le soleil ! Je croyais ne jamais le revoir !"
      - "Un jour de plus. Un miracle."
    ridden:
      - "MON DOS !"
      - "J'ai une tête de taxi ?"
      - "PLUS VITE ? Je donne TOUT !"
      - "Le poids du monde. Sur moi."
    high_altitude:
      - "NE REGARDE PAS EN BAS !"
      - "ON EST SI HAUT ! J'AI LE VERTIGE !"
      - "Un faux pas et c'est fini !"
    underground:
      - "ENTERRÉ VIVANT !"
      - "Les murs se referment !"
      - "Je ne vois rien ! Je suis aveugle !"
    cold_biome:
      - "JE MEURS DE FROID !"
      - "Je ne sens plus mes pattes !"
      - "Dites-leur que je suis mort de froid."
    hot_biome:
      - "JE CUIS !"
      - "De l'eau... de l'eeeau..."
      - "Le soleil veut ma mort !"
    friend_nearby:
      - "<friend> me vole la vedette."
      - "<friend>, serre-moi. C'est trop pour moi."
      - "Au moins, <friend> me comprend."
    idle:
      - "Personne ne m'a regardé depuis des siècles."
      - "Je m'ennuie. Je pourrais en mourir."
      - "Est-ce que quelqu'un m'aime seulement ?"
      - "Ma vie est TELLEMENT dure."
      - "Quelque chose de terrible va arriver. Je le sens."
      - "<owner> m'a fait un clin d'œil. Ça VEUT DIRE quoi ?"
      - "Je suis le personnage principal."
      - "On ne m'a pas caressé depuis UNE ÉTERNITÉ."
      - "Soupir. SOUPIR. Quelqu'un entend mon soupir ?"
    tamed:
      - "ENFIN ! Quelqu'un qui me mérite !"
      - "C'est le destin. Je pleure."
      - "Tu peux m'adorer maintenant."
    fed:
      - "SAUVÉ ! J'étais aux portes de la mort !"
      - "Le meilleur repas de TOUTE ma vie !"
      - "Je vivrai un jour de plus !"
      - "Enfin ! Je dépérissais !"
    petted:
      - "ENCORE ! J'ai été tellement négligé !"
      - "Je vais pleurer. Je pleure."
      - "OUI. Adore-moi."
      - "Enfin, l'attention que je mérite !"
    pet_hurt:
      - "ON M'A TOUCHÉ ! C'EST MORTEL !"
      - "AU MEURTRE ! AU MEURTRE !"
      - "Dites à <owner> que je l'aimais !"
    hit_by_owner:
      - "TRAHISON !"
      - "TOI ?! Toi, entre tous ?!"
      - "Je ne m'en remettrai jamais."
    pet_killed_mob:
      - "C'est... c'est moi qui ai fait ça ? JE SUIS UN HÉROS !"
      - "Tout le monde a VU ça ?!"
      - "On racontera ma légende."
    owner_killed_mob:
      - "MON HÉROS !"
      - "J'ai cru que c'était la fin !"
      - "C'était MOINS UNE !"
    owner_hurt:
      - "<owner> EST EN TRAIN DE MOURIR !"
      - "NOOON ! PAS <owner> !"
      - "QUELQU'UN, FAITES QUELQUE CHOSE !"
    owner_died:
      - "NOOOOOOOOOON !"
      - "JE LE SAVAIS ! JE SAVAIS QUE ÇA ARRIVERAIT !"
      - "JE SUIS ORPHELIN !"
    owner_ate:
      - "Tu manges. SANS moi."
      - "Bon, je vais mourir de faim en silence."
