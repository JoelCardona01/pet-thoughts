# ----------------------------------------------------------------------
#  Pet Thoughts - Français
#
#  Tout est en MiniMessage (https://docs.advntr.dev/minimessage/).
#  Variables utilisables dans n'importe quelle pensée :
#    <owner>   le nom du maître
#    <pet>     le nom de l'animal (ou son espèce s'il n'en a pas)
#    <mob>     le monstre / la créature concernée
#    <friend>  un autre animal à proximité
#    <food>    la nourriture concernée
#
#  Une pensée est tirée de  thoughts.<personnalité>.<déclencheur>.
#  Les lignes de  species.<espèce>.<déclencheur>  s'y mêlent pour cette espèce.
#  Ajoutez, modifiez ou supprimez autant de lignes que vous voulez. Une liste
#  vide ([]) rend muette cette combinaison. Rechargez avec /petthoughts reload.
# ----------------------------------------------------------------------

messages:
  prefix: "<gray>[<white>💭</white>]</gray> "
  no-permission: "<red>Vous n'avez pas la permission de faire ça."
  players-only: "<red>Seuls les joueurs peuvent utiliser cette commande."
  look-at-pet: "<red>Regardez un animal apprivoisé (à 8 blocs maximum)."
  not-your-pet: "<red>Ce n'est pas votre animal."
  toggle-off: "<yellow>Bulles de pensée masquées. Vos animaux pensent toujours, vous ne le voyez juste plus."
  toggle-on: "<green>Bulles de pensée de nouveau visibles."
  mute-on: "<yellow><pet> gardera ses pensées pour lui."
  mute-off: "<green><pet> partage de nouveau ses pensées."
  set-done: "<green><pet> est maintenant <white><personality></white>."
  unknown-personality: "<red>Personnalité inconnue. Options : <white><list>"
  unknown-trigger: "<red>Déclencheur inconnu. Utilisez Tab pour tous les voir."
  test-done: "<gray><white><trigger></white> forcé sur <pet>."
  test-no-line: "<red>Aucune ligne pour <white><trigger></white> dans le fichier de langue."
  reloaded: "<green>Configuration et langue rechargées."
  # Affiché au-dessus de la barre d'action quand un animal est apprivoisé. Laissez vide ("") pour désactiver.
  tamed-hint: "<white><pet></white> <gray>a une personnalité :</gray> <yellow><personality>"
  help:
    header: "<white>💭 <bold>Pet Thoughts</bold>"
    toggle: "<yellow>/<label> toggle <gray>- masquer ou afficher les bulles pour vous"
    info: "<yellow>/<label> info <gray>- personnalité et humeur de l'animal que vous regardez"
    mute: "<yellow>/<label> mute <gray>- rendre muet l'animal que vous regardez (ou le laisser reparler)"
    petting: "<gray>Regardez votre animal et appuyez sur <white>F</white> (changer de main) pour le caresser <red>❤"
    set: "<yellow>/<label> set <personality> <gray>- changer la personnalité de l'animal que vous regardez"
    test: "<yellow>/<label> test <trigger> <gray>- forcer une pensée"
    reload: "<yellow>/<label> reload <gray>- recharger la configuration et la langue"
  info:
    header: "<white>💭 <bold><pet></bold> <gray>(<species>)"
    personality: "<gray>Personnalité : <yellow><personality></yellow> - <description>"
    mood: "<gray>Humeur : <white><mood>"
    health: "<gray>Santé : <red>❤ <white><health>/<max_health>"
    last-thought: "<gray>Dernière pensée : <white><italic><thought>"
    no-thought: "<dark_gray>rien pour l'instant"
    muted: "<red>Muet. <gray>Utilisez /pt mute pour le laisser reparler."

bubble:
  # Petite icône devant chaque type de pensée (couleurs et <bold> acceptés). Vide = pas d'icône.
  prefix:
    thought: ""
    danger: "<#D32F2F><bold>!</bold>"
    love: "<#E0245E>❤"
    food: "<#A0522D>🍖"

