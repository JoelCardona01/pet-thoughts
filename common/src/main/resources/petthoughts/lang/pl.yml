# ----------------------------------------------------------------------
#  Pet Thoughts - Polski
#
#  Wszystko jest w formacie MiniMessage (https://docs.advntr.dev/minimessage/).
#  Zmienne, których można użyć w każdej myśli:
#    <owner>   imię właściciela
#    <pet>     imię zwierzaka (lub jego gatunek, jeśli nie ma imienia)
#    <mob>     potwór / mob
#    <friend>  inny zwierzak w pobliżu
#    <food>    jedzenie
#
#  Myśl jest losowana z  thoughts.<osobowość>.<zdarzenie>.
#  Linie z  species.<gatunek>.<zdarzenie>  są dodawane dla danego gatunku.
#  Dodawaj, zmieniaj i usuwaj linie, ile chcesz. Pusta lista ([])
#  wycisza dane połączenie. Przeładuj komendą /petthoughts reload.
# ----------------------------------------------------------------------

messages:
  prefix: "<gray>[<white>💭</white>]</gray> "
  no-permission: "<red>Nie masz uprawnień, żeby to zrobić."
  players-only: "<red>Tylko gracze mogą użyć tej komendy."
  look-at-pet: "<red>Spójrz na oswojonego zwierzaka (do 8 bloków)."
  not-your-pet: "<red>To nie jest twój zwierzak."
  toggle-off: "<yellow>Dymki myśli ukryte. Twoje zwierzaki dalej myślą, tylko tego nie widzisz."
  toggle-on: "<green>Dymki myśli znów widoczne."
  mute-on: "<yellow><pet> zachowa swoje myśli dla siebie."
  mute-off: "<green><pet> znów dzieli się myślami."
  set-done: "<green>Osobowość <pet>: <white><personality></white>."
  unknown-personality: "<red>Nieznana osobowość. Opcje: <white><list>"
  unknown-trigger: "<red>Nieznane zdarzenie. Użyj Tab, żeby zobaczyć wszystkie."
  test-done: "<gray>Wymuszono <white><trigger></white> u <pet>."
  test-no-line: "<red>W pliku języka nie ma linii dla <white><trigger></white>."
  reloaded: "<green>Konfiguracja i język przeładowane."
  # Pokazywane nad paskiem szybkiego wyboru po oswojeniu. Zostaw puste (""), żeby wyłączyć.
  tamed-hint: "<white><pet></white> <gray>ma osobowość:</gray> <yellow><personality>"
  help:
    header: "<white>💭 <bold>Pet Thoughts</bold>"
    toggle: "<yellow>/<label> toggle <gray>- ukryj lub pokaż dymki dla siebie"
    info: "<yellow>/<label> info <gray>- osobowość i nastrój zwierzaka, na którego patrzysz"
    mute: "<yellow>/<label> mute <gray>- wycisz zwierzaka, na którego patrzysz (lub pozwól mu znów mówić)"
    petting: "<gray>Spójrz na zwierzaka i wciśnij <white>F</white> (zmiana ręki), żeby go pogłaskać <red>❤"
    set: "<yellow>/<label> set <personality> <gray>- zmień osobowość zwierzaka, na którego patrzysz"
    test: "<yellow>/<label> test <trigger> <gray>- wymuś myśl"
    reload: "<yellow>/<label> reload <gray>- przeładuj konfigurację i język"
  info:
    header: "<white>💭 <bold><pet></bold> <gray>(<species>)"
    personality: "<gray>Osobowość: <yellow><personality></yellow> - <description>"
    mood: "<gray>Nastrój: <white><mood>"
    health: "<gray>Zdrowie: <red>❤ <white><health>/<max_health>"
    last-thought: "<gray>Ostatnia myśl: <white><italic><thought>"
    no-thought: "<dark_gray>jeszcze nic"
    muted: "<red>Wyciszony. <gray>Użyj /pt mute, żeby znów mógł mówić."

bubble:
  # Ikonka przed każdym rodzajem myśli (kolory i <bold> działają). Puste = bez ikonki.
  prefix:
    thought: ""
    danger: "<#D32F2F><bold>!</bold>"
    love: "<#E0245E>❤"
    food: "<#A0522D>🍖"

