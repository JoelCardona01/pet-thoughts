  # -------------------------------------------------------- PHILOSOPHER
  philosopher:
    pet_on_fire:
      - "Am I the fire, or is the fire me?"
      - "Heat is only fast atoms. Still, ow."
      - "All things burn eventually."
    pet_low_health:
      - "Pain is just the body's opinion."
      - "What is health, really? Low. It's low."
      - "Every ending is a kind of beginning..."
