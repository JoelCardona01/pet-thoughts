# ======================================================================
#  THOUGHTS BY PERSONALITY
# ======================================================================
thoughts:

  # -------------------------------------------------------------- LOYAL
  loyal:
    pet_on_fire:
      - "I'm fine! Is <owner> safe?!"
      - "Hot! Hot! Don't worry about me!"
      - "It burns, but I'm staying with you!"
    pet_low_health:
      - "I can still fight for you..."
      - "It hurts, but I won't leave you."
      - "Don't worry about me, <owner>."
      - "Just a scratch. A big one."
    owner_low_health:
      - "<owner>, get behind me!"
      - "You're hurt! Stay close!"
      - "Please be okay, <owner>."
      - "Nobody touches <owner> again!"
    hostile_nearby:
      - "I'll protect you!"
      - "Stay back, <mob>!"
      - "<mob>! Get behind me, <owner>!"
      - "Not on my watch."
      - "I've got this, <owner>."
    hostile_creeper:
      - "Creeper! <owner>, RUN!"
      - "Stay away from it, <owner>!"
      - "I'll distract it! Go!"
    owner_returned:
      - "YOU'RE BACK!!!"
      - "<owner>! I waited right here!"
      - "I knew you'd come back!"
      - "I missed you SO much!"
    in_nether:
      - "Scary place. I'm staying close."
      - "I'll follow you anywhere. Even here."
      - "Careful, <owner>. The floor is lava."
    in_end:
      - "Don't look at the tall ones, <owner>."
      - "Wherever this is, I'm with you."
      - "I'll guard your back out here."
    in_water:
      - "I'm coming, <owner>!"
      - "Swimming together!"
      - "I'd cross an ocean for you."
    owner_holds_food:
      - "Is that for me? No pressure."
      - "Whatever you have, I'll love it."
      - "I'd share mine with you, you know."
      - "You always know what I like."
    owner_hungry:
      - "<owner>, you need to eat something."
      - "Eat, please. I worry about you."
      - "You feed me. Who feeds you?"
    sitting_long:
      - "Still sitting. Like you asked."
      - "I haven't moved. Promise."
      - "Guarding this spot with my life."
    owner_sleeping:
      - "Sleep well. I'm keeping watch."
      - "Nothing gets past me tonight."
      - "Goodnight, <owner>."
    in_boat:
      - "Captain <owner>, ready to sail!"
      - "I'm your first mate!"
      - "Wherever you row, I go."
    leashed:
      - "You don't need this. I'd never leave."
      - "Lead the way, <owner>!"
      - "A walk with <owner>! Best day."
    thunder:
      - "Don't be scared, <owner>. I'm here."
      - "Loud sky. I'll protect you."
      - "Stay inside, <owner>!"
    rain:
      - "Rain can't stop us."
      - "Wet, but with you. Worth it."
      - "I'll shake it off later. On you."
    owner_flying:
      - "Come back down safe, <owner>!"
      - "Be careful up there!"
      - "I'll wait right here. Looking up."
    night:
      - "It's dark. I'm on guard."
      - "Stay near me tonight, <owner>."
      - "Night shift. Protecting <owner>."
    dawn:
      - "Good morning, <owner>!"
      - "We made it through the night!"
      - "New day, same best friend."
    ridden:
      - "Hold on tight, <owner>!"
      - "I'll get you there safe."
      - "Tell me where and I'll run."
      - "Proud to carry you."
    high_altitude:
      - "Careful near the edge, <owner>."
      - "It's high. Stay close to me."
      - "I'll follow you to the top of the world."
    underground:
      - "It's dark. I'll go first."
      - "Stay behind me in the tunnels."
      - "I can hear things. I'm ready."
    cold_biome:
      - "Cold! Come closer, I'm warm."
      - "I'll keep you warm, <owner>."
      - "Snow can't stop us."
    hot_biome:
      - "Hot. Do you have water, <owner>?"
      - "I'll walk in your shadow."
      - "Too hot, but I'm not leaving."
    friend_nearby:
      - "<friend> and I are guarding you."
      - "Good team, <friend>."
      - "<friend> is family too."
    idle:
      - "I love <owner>."
      - "Best. Owner. Ever."
      - "Do you need anything, <owner>?"
      - "Just happy to be here."
      - "Where you go, I go."
      - "Guarding <owner>. As usual."
      - "Is <owner> okay? Yes. Good."
      - "I'd do anything for <owner>."
      - "Today was good. You were in it."
    tamed:
      - "I choose you. Forever."
      - "You and me, <owner>. Always."
      - "I'll never leave your side."
    fed:
      - "Thank you, <owner>!"
      - "You always take care of me."
      - "Delicious. I love you."
      - "Now I'm strong enough to protect you."
    petted:
      - "I love you too, <owner>!"
      - "Best. Day. Ever."
      - "Don't stop!"
      - "This is why I guard you."
    pet_hurt:
      - "Ow! I'm okay! I'm okay!"
      - "They'll have to try harder."
      - "It only hurts a little."
    hit_by_owner:
      - "It was an accident. I know."
      - "I forgive you, <owner>."
      - "I still love you."
    pet_killed_mob:
      - "It won't bother you again."
      - "<owner> is safe. Job done."
      - "Nobody threatens my human."
    owner_killed_mob:
      - "Great hit, <owner>!"
      - "That's my human!"
      - "We make a good team."
    owner_hurt:
      - "<owner>! Are you okay?!"
      - "Who did that to you?!"
      - "Stay behind me!"
    owner_died:
      - "<owner>?! <owner>!!!"
      - "No... I was supposed to protect you."
      - "I'll wait here until you come back."
    owner_ate:
      - "Good. You need your strength."
      - "Eat well, <owner>."
      - "I'm glad you're eating."
    owner_fished:
      - "Nice catch, <owner>!"
      - "You're so good at this."
      - "Fishing with you is the best."
    owner_found_treasure:
      - "You found it! I knew you would!"
      - "Shiny! You deserve it."
      - "All that digging paid off!"
    owner_advancement:
      - "I'm so proud of you!"
      - "You did it, <owner>!"
      - "I always believed in you."
    sat_down:
      - "Sitting. I'll wait for you."
      - "I'll be right here."
      - "Come back soon, okay?"
    stood_up:
      - "Adventure time!"
      - "Ready when you are!"
      - "Let's go, <owner>!"
    teleported:
      - "Found you!"
      - "You can't lose me that easily."
      - "I'm here! I'm here!"
    had_baby:
      - "Look, <owner>! A little one!"
      - "I'll teach it to protect you."
      - "Our family is growing."
    music:
      - "Our song, <owner>!"
      - "I like it when you're happy."
      - "Dancing with you!"
    explosion:
      - "<owner>! Are you hurt?!"
      - "Get away from there!"
      - "I'm between you and the boom!"

  # -------------------------------------------------------------- DRAMA
  drama:
    pet_on_fire:
      - "I'M ON FIRE! LITERALLY!"
      - "TELL MY STORY!"
      - "SO THIS IS HOW I GO. CRISPY."
    pet_low_health:
      - "I can see the light..."
      - "Tell <owner>... I was fabulous."
      - "THIS IS THE END OF ME."
      - "Avenge me!"
    owner_low_health:
      - "DON'T YOU DARE DIE ON ME!"
      - "WHO WILL FEED ME IF YOU DIE?!"
      - "<owner>! STAY WITH ME!"
      - "NOT LIKE THIS!"
    hostile_nearby:
      - "THIS IS HOW IT ENDS."
      - "A <mob>! WE'RE DOOMED!"
      - "I'M TOO YOUNG FOR THIS!"
      - "SAVE YOURSELVES!"
      - "<mob>! I CAN'T LOOK!"
    hostile_creeper:
      - "IT'S GOING TO EXPLODE! WE ALL ARE!"
      - "A CREEPER! GOODBYE, CRUEL WORLD!"
      - "NOT THE GREEN ONE!"
    owner_returned:
      - "I THOUGHT YOU WERE DEAD!"
      - "YEARS! YOU WERE GONE FOR YEARS!"
      - "You LEFT me. But you're back!"
      - "NEVER DO THAT AGAIN."
    in_nether:
      - "WE'RE IN HELL. ACTUAL HELL."
      - "EVERYTHING IS ON FIRE!"
      - "My beautiful looks! The heat!"
    in_end:
      - "THE END?! WHO NAMED THIS PLACE?!"
      - "There's NOTHING down there!"
      - "This is literally the end."
    in_water:
      - "I'M DROWNING! Oh, I can swim."
      - "MY HAIR!"
      - "MAN OVERBOARD! IT'S ME!"
    owner_holds_food:
      - "IS THAT FOR ME?!"
      - "I'm STARVING. I may faint."
      - "Give it to me or I perish."
      - "I haven't eaten in MINUTES."
    owner_hungry:
      - "You're wasting away, <owner>!"
      - "EAT! Before it's too late!"
      - "I can hear your stomach from here!"
    sitting_long:
      - "I've been abandoned. Here. Forever."
      - "My legs have forgotten how to walk."
      - "They'll find my skeleton sitting here."
    owner_sleeping:
      - "And now I'm alone in the dark. Great."
      - "What if <owner> never wakes up?!"
      - "Sure. Sleep. I'll just worry."
    in_boat:
      - "WE'RE GOING TO SINK!"
      - "I get seasick! Probably!"
      - "The sea takes who it wants..."
    leashed:
      - "CHAINED! Like a criminal!"
      - "Is this what I am to you?!"
      - "The INDIGNITY."
    thunder:
      - "THE SKY IS BREAKING!"
      - "IT'S THE END OF THE WORLD!"
      - "HIDE ME!"
    rain:
      - "I'm MELTING!"
      - "The sky is crying. So am I."
      - "RUINED. My look is RUINED."
    owner_flying:
      - "COME DOWN! YOU'LL FALL!"
      - "I can't watch! I'm watching."
      - "People aren't meant to FLY!"
    night:
      - "The darkness comes for us all."
      - "It's night. The monsters know."
      - "We won't survive until morning."
    dawn:
      - "WE SURVIVED! I can't believe it!"
      - "The sun! I thought I'd never see it!"
      - "Another day. A miracle."
    ridden:
      - "MY BACK!"
      - "Do I look like a taxi?"
      - "FASTER? I'm giving it EVERYTHING!"
      - "The weight of the world. On me."
    high_altitude:
      - "DON'T LOOK DOWN!"
      - "WE'RE SO HIGH! I'M DIZZY!"
      - "One wrong step and it's over!"
    underground:
      - "BURIED ALIVE!"
      - "The walls are closing in!"
      - "I can't see! I've gone blind!"
    cold_biome:
      - "I'M FREEZING TO DEATH!"
      - "I can't feel my legs!"
      - "Tell them I died cold."
    hot_biome:
      - "I'M COOKING!"
      - "Water... waaater..."
      - "The sun wants me dead!"
    friend_nearby:
      - "<friend> is stealing my spotlight."
      - "<friend>, hold me. I'm overwhelmed."
      - "At least <friend> understands me."
    idle:
      - "Nobody has looked at me in ages."
      - "I'm bored. I might die of it."
      - "Does anyone even love me?"
      - "My life is SO hard."
      - "Something terrible will happen. I feel it."
      - "<owner> blinked at me. What did it MEAN?"
      - "I am the main character."
      - "I haven't been pet in FOREVER."
      - "Sigh. SIGH. Is anyone hearing me sigh?"
    tamed:
      - "FINALLY! Someone who deserves me!"
      - "It's destiny. I'm crying."
      - "You may worship me now."
    fed:
      - "SAVED! I was at death's door!"
      - "The best meal of my ENTIRE life!"
      - "I shall live another day!"
      - "Finally! I was fading away!"
    petted:
      - "MORE! I've been so neglected!"
      - "I may cry. I'm crying."
      - "YES. Adore me."
      - "Finally, the attention I deserve!"
    pet_hurt:
      - "I'VE BEEN HIT! IT'S FATAL!"
      - "MURDER! MURDER!"
      - "Tell <owner> I loved them!"
    hit_by_owner:
      - "BETRAYAL!"
      - "YOU?! Of all people?!"
      - "I'll never emotionally recover."
    pet_killed_mob:
      - "I... I did that? I'M A HERO!"
      - "Did everyone SEE that?!"
      - "Legends will be told about me."
    owner_killed_mob:
      - "MY HERO!"
      - "I thought we were finished!"
      - "That was SO close!"
    owner_hurt:
      - "<owner> IS DYING!"
      - "NOOO! NOT <owner>!"
      - "SOMEBODY DO SOMETHING!"
    owner_died:
      - "NOOOOOOOOOOO!"
      - "I KNEW IT! I KNEW THIS WOULD HAPPEN!"
      - "I'M AN ORPHAN!"
    owner_ate:
      - "You're eating. WITHOUT me."
      - "I'll just starve quietly then."
      - "Not even one bite? Wow."
    owner_fished:
      - "A SEA MONSTER! Oh. A fish."
      - "You pulled a LIFE out of the water!"
      - "It's looking at me!"
    owner_found_treasure:
      - "WE'RE RICH!"
      - "I'll never have to work again!"
      - "I'd like to thank my fans."
    owner_advancement:
      - "A STAR IS BORN! (It's me. I helped.)"
      - "I'm so proud I could faint!"
      - "We did it! Mostly me!"
    sat_down:
      - "So you're leaving me. Fine."
      - "Abandoned. Again."
      - "I'll just sit here and suffer."
    stood_up:
      - "FREEDOM!"
      - "My legs! They work!"
      - "I'm ALIVE again!"
    teleported:
      - "WHAT JUST HAPPENED?!"
      - "I was ripped through SPACE!"
      - "I saw my whole life flash by!"
    had_baby:
      - "A BABY! It has my good looks!"
      - "I'm a PARENT! I'm not ready!"
      - "It's the most beautiful thing ever!"
    music:
      - "This song gets me. It GETS me."
      - "I'm feeling ALL the feelings."
      - "TURN IT UP!"
    explosion:
      - "WE'RE UNDER ATTACK!"
      - "THE WORLD IS ENDING!"
      - "AAAAAAAAH!"

  # ------------------------------------------------------------- GRUMPY
  grumpy:
    pet_on_fire:
      - "Great. Now I'm on fire."
      - "Of course I'm on fire. Typical."
      - "I'd like to file a complaint."
    pet_low_health:
      - "Ow. Thanks for nothing."
      - "I've had better days. Not many."
      - "Don't mind me. Just bleeding."
      - "This is your fault somehow."
    owner_low_health:
      - "You look terrible. Eat something."
      - "Don't die. I'd have to find a new one."
      - "I told you this would happen."
      - "Try NOT getting hit next time."
    hostile_nearby:
      - "Ugh. <mob>. Again."
      - "Oh good. A <mob>. Wonderful."
      - "Somebody deal with that <mob>."
      - "I'm not getting up for a <mob>."
      - "Really? Now?"
    hostile_creeper:
      - "A creeper. Because of course."
      - "If it blows up my nap spot, I swear..."
      - "Hissing. How original."
    owner_returned:
      - "Oh. You're back."
      - "Took you long enough."
      - "I didn't miss you. Much."
      - "You were gone? Didn't notice."
    in_nether:
      - "Too hot. I hate it."
      - "Why did we come here? Why?"
      - "Lovely. Lava. Everywhere."
    in_end:
      - "No floor. Brilliant."
      - "It's ugly here. Can we go?"
      - "Even the sky gave up here."
    in_water:
      - "Wet. Fantastic."
      - "I didn't ask for a bath."
      - "Now I'll smell. Your problem."
    owner_holds_food:
      - "You're going to give me that, right?"
      - "Don't wave it around. Hand it over."
      - "About time."
      - "I saw it. You can't hide it now."
    owner_hungry:
      - "Eat. You get cranky when hungry."
      - "Your stomach is louder than me."
      - "You feed me late AND forget yourself."
    sitting_long:
      - "Still here. Thanks for asking."
      - "My butt is numb."
      - "Forgot about me, did you?"
    owner_sleeping:
      - "Oh, so YOU get a bed."
      - "And they snore, too."
      - "Finally. Some peace."
    in_boat:
      - "I didn't agree to this cruise."
      - "Boats. Wet AND boring."
      - "Are we there yet?"
    leashed:
      - "A leash. Really."
      - "I can walk by myself, thanks."
      - "Don't pull."
    thunder:
      - "Could the sky keep it down?"
      - "Some of us are trying to nap."
      - "Too loud. Zero stars."
    rain:
      - "Great. Rain."
      - "I'm wet. Are you happy now?"
      - "Whose idea was outside?"
    owner_flying:
      - "Show-off."
