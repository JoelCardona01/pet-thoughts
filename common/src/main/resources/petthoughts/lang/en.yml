      - "Floating: falling, but slower."
      - "Fish never wonder about this."
    owner_holds_food:
      - "Is it mine before you give it to me?"
      - "To want is to suffer. I want it."
      - "What is food but a future me?"
      - "If I stare, does it become mine?"
    owner_hungry:
      - "Hunger: the body asking why."
      - "An empty stomach is a loud teacher."
      - "You feed me, yet not yourself. Curious."
    sitting_long:
      - "If I sit forever, am I still a pet?"
      - "Sitting is just standing, but wiser."
      - "I have become one with the floor."
    owner_sleeping:
      - "Where do humans go when they sleep?"
      - "Do they dream of blocks?"
      - "Is <owner> still <owner> while asleep?"
    in_boat:
      - "Does the boat move, or the world?"
      - "We float. Why does anything float?"
      - "A boat is a floor that travels."
    leashed:
      - "Who is leading whom, really?"
      - "We are all tied to something."
      - "The rope has two ends. Think about it."
    thunder:
      - "Is the sky angry, or just clearing its throat?"
      - "Light first, sound later. Why the delay?"
      - "Who is the thunder shouting at?"
    rain:
      - "Is the rain falling, or are we rising?"
      - "Every drop was once a cloud. Like dreams."
      - "Why does the sky leak?"
    owner_flying:
      - "If humans can fly, what else is a lie?"
      - "Is that <owner> or a very large bird?"
      - "Falling with style. Fascinating."
    night:
      - "Where does the sun go?"
      - "Is night just the day resting?"
      - "The moon is square. Nobody talks about it."
    dawn:
      - "Is it a new day, or the same one again?"
      - "The sun returns. It always forgives us."
      - "Morning: the world reloading."
    ridden:
      - "Am I carrying you, or are we one?"
      - "Where are we going? Does anyone know?"
      - "The journey is the destination. My legs disagree."
      - "Who rides the rider?"
    high_altitude:
      - "From up here, problems look like blocks."
      - "How high is too high to think?"
      - "The clouds are below. What are we now?"
    underground:
      - "Darkness is just light on holiday."
      - "How deep does the world go?"
      - "Do the stones know we are here?"
    cold_biome:
      - "Is cold a thing, or the absence of a thing?"
      - "Each snowflake is unique. And yet: snow."
      - "Why is white so quiet?"
    hot_biome:
      - "How many grains of sand until it's a desert?"
      - "The sun gives life. And also this."
      - "A cactus asks for nothing. Admirable."
    friend_nearby:
      - "<friend>, do you ever wonder why?"
      - "Does <friend> see the same colors I do?"
      - "<friend> and I share a silence."
    idle:
      - "What if we are all inside a game?"
      - "Do my thoughts have a bubble?"
      - "Why do humans punch trees?"
      - "If a tree falls and floats... wait."
      - "Am I a good pet, or just a pet?"
      - "Who tamed whom?"
      - "A block is a cube. But is a cube a block?"
      - "Where do items go when they despawn?"
      - "I blink, therefore I am."
      - "Is <owner> real when I'm not looking?"
    tamed:
      - "So this is belonging."
      - "Did you choose me, or did I allow it?"
      - "A new chapter. What was the old one?"
    fed:
      - "The <food> is gone. Yet it remains in me."
      - "To eat is to borrow from the world."
      - "Was I hungry, or merely curious?"
      - "Delicious. But what is taste?"
    petted:
      - "What is a hand, if not a moving hug?"
      - "Affection needs no explanation. Pleasant."
      - "I am touched. Literally and otherwise."
      - "Is this happiness? I believe so."
    pet_hurt:
      - "Pain: a reminder that I exist."
      - "Why did that happen? Why does anything?"
      - "Interesting. Unpleasant, but interesting."
    hit_by_owner:
      - "Was that a mistake, or a lesson?"
      - "Even love misclicks."
      - "I forgive, therefore I am."
    pet_killed_mob:
      - "Where did the <mob> go just now?"
      - "It dropped things. Is that all it was?"
      - "Victory tastes like nothing. Hm."
    owner_killed_mob:
      - "Did it have dreams?"
      - "It is experience orbs now. So are we all."
      - "Was that necessary? Probably."
    owner_hurt:
      - "Pain visits everyone. Even <owner>."
      - "Are hearts a measure of the soul?"
      - "You bleed, therefore you are."
    owner_died:
      - "Where do owners go when they vanish?"
      - "Gone. And yet they always return. How?"
      - "Death is just a long teleport."
    owner_ate:
      - "You eat, I watch. Such is the order."
      - "Does the <food> know its fate?"
      - "One day I, too, shall have <food>."
    owner_fished:
      - "Did you catch the fish, or did it choose you?"
      - "The fish knew a different world."
      - "Patience, rewarded with something wet."
    owner_found_treasure:
      - "Why do shiny things matter to them?"
      - "It waited a million years for you."
      - "Value is just agreement about rocks."
    owner_advancement:
      - "Who gives out these achievements?"
      - "Progress. But toward what?"
      - "A message appeared. You seem pleased."
    sat_down:
      - "To sit is to pause the self."
      - "I sit. The world continues."
      - "Stillness. My favorite movement."
    stood_up:
      - "And so, we go on."
      - "Standing: a decision made by legs."
      - "Every walk begins with a getting up."
    teleported:
      - "I was there. Now here. Was I between?"
      - "Am I the same pet that left?"
      - "Distance is an illusion, apparently."
    had_baby:
      - "A new mind enters the world."
      - "What will it wonder about?"
      - "Life makes more life. But why?"
    music:
      - "What is music, but organized air?"
      - "The disc spins. So does the world."
      - "Sound with feelings. Remarkable."
    explosion:
      - "Loud things rarely have good reasons."
      - "Matter, rearranged. Suddenly."
      - "Was that the answer? I missed the question."

