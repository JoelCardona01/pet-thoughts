# ----------------------------------------------------------------------
#  Pet Thoughts - English
#
#  Everything is MiniMessage (https://docs.advntr.dev/minimessage/).
#  Variables you can use in any thought:
#    <owner>   the owner's name
#    <pet>     the pet's name tag (or its species if it has none)
#    <mob>     the monster / mob involved
#    <friend>  another pet nearby
#    <food>    the food involved
#
#  A thought is picked from  thoughts.<personality>.<trigger>.
#  Lines in  species.<species>.<trigger>  are mixed in for that species.
#  Add, edit or delete as many lines as you like. An empty list ([])
#  silences that combination. Reload with /petthoughts reload.
# ----------------------------------------------------------------------

messages:
  prefix: "<gray>[<white>💭</white>]</gray> "
  no-permission: "<red>You don't have permission to do that."
  players-only: "<red>Only players can use this command."
  look-at-pet: "<red>Look at a tamed pet (up to 8 blocks away)."
  not-your-pet: "<red>That is not your pet."
  toggle-off: "<yellow>Thought bubbles hidden. Your pets still think, you just can't see it."
  toggle-on: "<green>Thought bubbles visible again."
  mute-on: "<yellow><pet> will keep its thoughts to itself."
  mute-off: "<green><pet> is sharing its thoughts again."
  set-done: "<green><pet> is now <white><personality></white>."
  unknown-personality: "<red>Unknown personality. Options: <white><list>"
  unknown-trigger: "<red>Unknown trigger. Use tab completion to see them all."
  test-done: "<gray>Forced <white><trigger></white> on <pet>."
  test-no-line: "<red>There are no lines for <white><trigger></white> in the language file."
  reloaded: "<green>Config and language reloaded."
  # Shown above the hotbar when a pet is tamed. Leave empty ("") to disable.
  tamed-hint: "<white><pet></white> <gray>has a personality:</gray> <yellow><personality>"
  help:
    header: "<white>💭 <bold>Pet Thoughts</bold>"
    toggle: "<yellow>/<label> toggle <gray>- hide or show thought bubbles for you"
    info: "<yellow>/<label> info <gray>- personality and mood of the pet you look at"
    mute: "<yellow>/<label> mute <gray>- silence the pet you look at (or let it talk again)"
    petting: "<gray>Look at your pet and press <white>F</white> (swap hands) to pet it <red>❤"
    set: "<yellow>/<label> set <personality> <gray>- change the personality of the pet you look at"
    test: "<yellow>/<label> test <trigger> <gray>- force a thought"
    reload: "<yellow>/<label> reload <gray>- reload config and language"
  info:
    header: "<white>💭 <bold><pet></bold> <gray>(<species>)"
    personality: "<gray>Personality: <yellow><personality></yellow> - <description>"
    mood: "<gray>Mood: <white><mood>"
    health: "<gray>Health: <red>❤ <white><health>/<max_health>"
    last-thought: "<gray>Last thought: <white><italic><thought>"
    no-thought: "<dark_gray>nothing yet"
    muted: "<red>Muted. <gray>Use /pt mute to let it talk again."

bubble:
  # Small icon in front of each kind of thought (colours and <bold> work). Empty = no icon.
  prefix:
    thought: ""
    danger: "<#D32F2F><bold>!</bold>"
    love: "<#E0245E>❤"
    food: "<#A0522D>🍖"

