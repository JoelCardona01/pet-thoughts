name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write   # needed to create releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin and mod
        run: ./gradlew build

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: PetThoughts
          path: |
            paper/build/libs/PetThoughts-*.jar
            fabric/build/libs/pet-thoughts-fabric-*.jar
            !**/*-sources.jar

      # Pushing a tag like v1.0.0 creates a GitHub Release with both jars attached.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            paper/build/libs/PetThoughts-*.jar
            fabric/build/libs/pet-thoughts-fabric-*.jar
          generate_release_notes: true
