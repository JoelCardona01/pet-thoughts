name: Build

on:
  push:
    branches: [ main, 'feature/**', 'backport/**' ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write   # needed to create releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build plugin and mods
        run: ./gradlew build

      - name: Upload jars
        uses: actions/upload-artifact@v5
        with:
          name: PetThoughts-mc26.1.2
          path: |
            fabric/build/libs/pet-thoughts-fabric-*.jar
            neoforge/build/libs/pet-thoughts-neoforge-*.jar
            !**/*-sources.jar

      # Pushing a tag like v1.0.0 creates a GitHub Release with all the jars attached.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fabric/build/libs/pet-thoughts-fabric-*.jar
            neoforge/build/libs/pet-thoughts-neoforge-*.jar
          generate_release_notes: true
