org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Shared by the plugin and the mods
version=1.0.0+mc26.1.2
group=dev.petthoughts

# Paper: compiled against the oldest supported API so one jar runs on 1.21.4 - 26.x
paper_api_version=1.21.4-R0.1-SNAPSHOT

# Backport branch: the Fabric and NeoForge mods for Minecraft 26.1.2
minecraft_version=26.1.2

# Fabric: check these on https://fabricmc.net/develop
loader_version=0.18.4
loom_version=1.19-SNAPSHOT
fabric_api_version=0.155.3+26.1.2
snakeyaml_version=2.2

# NeoForge: check these on https://projects.neoforged.net/neoforged/neoforge
neo_version=26.1.2.126
# Oldest NeoForge build the mod accepts at runtime.
neo_min_version=26.1.2.71

# Forge: check these on https://files.minecraftforge.net
forge_version=66.1.8
# First Minecraft version the Forge mod does not claim to support.
minecraft_next_version=26.4
# Asked for by ForgeGradle: resources and classes of the mod go to the same folder when run from the IDE.
net.minecraftforge.gradle.merge-source-sets=true
